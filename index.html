<!DOCTYPE html>
<!-- Modified by PrisamaX0124, 2026-10-05: guidance sign and platform editor enhancements; see docs/fork-changes.md. -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导向标识生成器</title>
  <link rel="stylesheet" href="style.css?v=public-98ba20244c33">
</head>
<body>

  <!-- 字体加载指示 -->
  <div id="loading-overlay" hidden>
    <div class="loading-spinner"></div>
    <div id="loading-text">正在加载字体…</div>
  </div>

  <div id="app">

    <!-- ══ 左栏：元素选择区 ══ -->
    <aside id="left-panel" class="side-panel">
      <div class="panel-header">
        <span class="panel-title">元素选择区</span>
        <button class="icon-btn collapse-btn" id="left-collapse" title="收起元素选择区">⟨</button>
      </div>
      <a class="editor-page-link" href="platform.html">站台吊板 / 线路图 ↗</a>
      <div class="panel-body" id="palette">
        <!-- panel.js 填充：分类元素卡片 + 预设 -->
      </div>
    </aside>
    <button id="left-expander" class="expander" title="展开元素选择区" hidden>⟩</button>

    <!-- ══ 中栏：SVG 编辑区 ══ -->
    <main id="center-panel">
      <div id="edit-actions" role="toolbar" aria-label="选择与剪贴板">
        <button type="button" data-edit-action="select-all" title="全选元素（Ctrl+A）">全选</button>
        <button type="button" data-edit-action="copy" title="复制选中元素（Ctrl+C）" disabled>复制</button>
        <button type="button" data-edit-action="cut" title="剪切选中元素（Ctrl+X）" disabled>剪切</button>
        <button type="button" data-edit-action="paste" title="粘贴元素（Ctrl+V）">粘贴</button>
        <span id="selection-status" aria-live="polite">Ctrl 单击加选 · Shift 单击范围选择</span>
      </div>
      <div id="canvas-scroll">
        <div id="canvas-area">
          <div id="canvas-wrap">
            <svg id="sign-svg" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="sign-overlay">
              <!-- interact.js 填充：行手柄/行按钮/拖放指示器 -->
            </div>
            <div id="empty-hint" hidden>从左侧拖放元素到此处开始编辑</div>
          </div>
          <!-- 移动端行管理条：interact.js 填充（行控件外置，不与牌面元素叠加） -->
          <div id="row-strip"></div>
          <button id="add-row-btn" title="在底部添加新行">＋ 添加行</button>
        </div>
      </div>
      <!-- 画布缩放徽标：仅移动布局显示，interact.js 更新倍率并接线复位 -->
      <button id="zoom-badge" title="当前缩放，点按复位">100%</button>
      <div id="element-toolbar" role="toolbar" aria-label="元素快捷操作" hidden></div>
    </main>

    <!-- ══ 右栏：属性 / 导出 ══ -->
    <button id="right-expander" class="expander expander-right" title="展开属性面板" hidden>⟨</button>
    <aside id="right-panel" class="side-panel">
      <div class="panel-header">
        <div class="panel-heading">
          <button class="icon-btn" id="close-element-btn" title="返回标识牌设置" aria-label="返回标识牌设置" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <span class="panel-title" id="right-panel-title">标识牌设置</span>
        </div>
        <button class="icon-btn collapse-btn" id="right-collapse" title="收起属性面板">⟩</button>
      </div>
      <div class="panel-body" id="right-panel-body">
        <!-- panel.js 填充：标识牌设置 / 元素属性 / 预设预览 -->
      </div>
    </aside>

  </div>

  <!-- 通知与对话框 -->
  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script src="js/core.js?v=public-181a8c8b1a69"></script>
  <script src="js/palettes.js?v=public-617b4fb22e1e"></script>
  <script src="js/palette-manager.js?v=public-71d85de854d0"></script>
  <script src="js/icons.js?v=public-8e9eb9f48086"></script>
  <script src="js/state.js?v=public-821e25ad8636"></script>
  <script src="js/render.js?v=public-02d87d9bea0d"></script>
  <script src="js/ui.js?v=public-e1501c309354"></script>
  <script src="js/clipboard.js?v=public-d58c305be636"></script>
  <script src="js/presets.js?v=public-e3eeae2acdc5"></script>
  <script src="js/storage.js?v=public-85ae228675bd"></script>
  <script src="js/exporters.js?v=public-56da7d254b51"></script>
  <script src="js/color-picker.js?v=public-55426316f73e"></script>
  <script src="js/panel.js?v=public-b84ece7a620f"></script>
  <script src="js/interact.js?v=public-0409ab7f584e"></script>
  <script src="js/main.js?v=public-5e0e07b88f2a"></script>
</body>
</html>
