<!DOCTYPE html>
<!-- Modified by PrisamaX0124, 2026-10-05: guidance sign and platform editor enhancements; see docs/fork-changes.md. -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1100">
  <title>导向标识生成器</title>
  <link rel="stylesheet" href="style.css?v=804d499ab69d">
  <link rel="stylesheet" href="platform.css?v=2bbd43e16f77">
  <link rel="stylesheet" href="transfer.css?v=e8bfd1a0d050">
</head>
<body class="editor-page">

  <!-- 字体加载指示 -->
  <div id="loading-overlay" hidden>
    <div class="loading-spinner"></div>
    <div id="loading-text">正在加载字体…</div>
  </div>

  <header class="editor-header">
    <div class="editor-header-content">
      <nav class="editor-navigation" aria-label="切换编辑器">
        <a href="index.html" aria-current="page">导向标识</a>
        <a href="index.html?editor=transfer">换乘标识</a>
        <a href="platform.html">站台标识</a>
      </nav>
      <a class="editor-repository" href="https://github.com/PrisamaX0124/CRT-Sign-Web-Editor" target="_blank" rel="noopener" aria-label="打开 GitHub 仓库，给项目加星（新标签页）" title="打开 GitHub 仓库">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg>
        <span>给项目加星</span>
      </a>
      <nav class="mode-tabs" id="transfer-modes" aria-label="换乘标识版式" hidden>
        <button type="button" data-transfer-mode="guidance" aria-pressed="true">版式 A</button>
        <button type="button" data-transfer-mode="separate" aria-pressed="false">版式 B</button>
      </nav>
    </div>
  </header>

  <div id="app" class="editor-workspace">

    <!-- ══ 左栏：元素选择区 ══ -->
    <aside id="left-panel" class="side-panel editor-left">
      <div class="panel-header">
        <span class="panel-title">元素选择区</span>
        <button class="icon-btn collapse-btn" id="left-collapse" title="收起元素选择区">⟨</button>
      </div>
      <div class="panel-body" id="palette">
        <!-- panel.js 填充：分类元素卡片 + 预设 -->
      </div>
    </aside>
    <button id="left-expander" class="expander" title="展开元素选择区" hidden>⟩</button>

    <!-- ══ 中栏：SVG 编辑区 ══ -->
    <main id="center-panel" class="editor-center">
      <div class="guide-action-bar">
        <div id="edit-actions" role="toolbar" aria-label="选择与剪贴板">
          <button type="button" data-edit-action="select-all" title="全选元素（Ctrl+A）">全选</button>
          <button type="button" data-edit-action="copy" title="复制选中元素（Ctrl+C）" disabled>复制</button>
          <button type="button" data-edit-action="cut" title="剪切选中元素（Ctrl+X）" disabled>剪切</button>
          <button type="button" data-edit-action="paste" title="粘贴元素（Ctrl+V）">粘贴</button>
          <span id="selection-status" aria-live="polite">Ctrl 单击加选 · Shift 单击范围选择</span>
        </div>
      </div>
      <div id="canvas-scroll">
        <div id="canvas-area">
          <div id="canvas-wrap">
            <svg id="sign-svg" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="sign-overlay">
              <!-- interact.js 填充：行手柄/行按钮/拖放指示器 -->
            </div>
            <div id="empty-hint" hidden>从左侧拖放元素到此处开始编辑</div>
          </div>
          <button id="add-row-btn" title="在底部添加新行">＋ 添加行</button>
        </div>
      </div>

      <div id="element-toolbar" class="floating-toolbar" role="toolbar" aria-label="元素快捷操作" hidden inert></div>
    </main>

    <!-- ══ 右栏：属性 / 导出 ══ -->
    <button id="right-expander" class="expander expander-right" title="展开属性面板" hidden>⟨</button>
    <aside id="right-panel" class="side-panel editor-right">
      <div class="panel-header">
        <div class="panel-heading">
          <button class="icon-btn" id="close-element-btn" title="返回标识牌设置" aria-label="返回标识牌设置" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <span class="panel-title" id="right-panel-title" tabindex="-1">标识牌设置</span>
        </div>
        <button class="icon-btn collapse-btn" id="right-collapse" title="收起属性面板">⟩</button>
      </div>
      <div class="panel-body" id="right-panel-body">
        <!-- panel.js 填充：标识牌设置 / 元素属性 / 预设预览 -->
      </div>
    </aside>

  </div>

  <div id="transfer-editor" class="editor-workspace" hidden>
    <aside class="platform-stations editor-left" id="transfer-content" aria-labelledby="transfer-content-heading">
      <h2 class="platform-panel-title" id="transfer-content-heading">线路与元素</h2>
      <div class="panel-body">
        <section class="platform-section transfer-section">
          <h3 class="section-title" id="transfer-arrangement-heading">线路分组</h3>
          <div id="transfer-arrangements" role="group" aria-labelledby="transfer-arrangement-heading"></div>
        </section>
        <section class="platform-section transfer-section">
          <h3 class="section-title">牌面元素</h3>
          <div id="transfer-groups"></div>
        </section>
      </div>
    </aside>
    <main class="platform-preview editor-center" id="transfer-preview" aria-label="换乘标识预览">
      <div class="preview-toolbar">
        <div class="transfer-preview-heading">
          <strong id="transfer-preview-title"></strong>
          <span id="transfer-dimensions"></span>
        </div>
        <div class="history-actions">
          <button type="button" id="transfer-undo" class="icon-btn" title="撤销" aria-label="撤销">↶</button>
          <button type="button" id="transfer-redo" class="icon-btn" title="重做" aria-label="重做">↷</button>
        </div>
      </div>
      <div class="transfer-preview-scroll" id="transfer-preview-scroll">
        <div class="transfer-paper">
          <svg id="transfer-sign" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="换乘标识牌上的元素"></svg>
        </div>
      </div>
      <div id="transfer-element-toolbar" class="floating-toolbar" role="toolbar" aria-label="元素快捷操作" hidden inert>
        <span id="transfer-toolbar-title"></span>
        <button type="button" id="transfer-tool-edit">编辑</button>
        <button type="button" id="transfer-tool-pattern">启用底纹</button>
        <button type="button" id="transfer-tool-turn">顺时针转向</button>
        <div id="transfer-tool-alignment" hidden></div>
        <div id="transfer-tool-arrow-position" hidden></div>
      </div>
      <div class="preview-footer"><div id="transfer-status" role="status">本地自动保存</div></div>
    </main>
    <aside class="platform-properties editor-right" id="transfer-properties" aria-labelledby="transfer-heading">
      <header class="panel-header">
        <div class="panel-heading">
          <button type="button" class="icon-btn" id="transfer-return" title="返回标识牌设置" aria-label="返回标识牌设置" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h1 class="panel-title" id="transfer-heading" tabindex="-1">标识牌设置</h1>
        </div>
      </header>
      <div class="panel-body" id="transfer-property-scroll">
        <div id="transfer-settings">
          <section class="platform-section transfer-section transfer-output-settings">
            <h2 class="section-title">颜色与尺寸</h2>
            <div class="field">
              <label for="transfer-palette">城市配色</label>
              <select id="transfer-palette"></select>
            </div>
            <div class="field">
              <label for="transfer-width">标识牌宽度</label>
              <div class="transfer-width-setting">
                <input type="number" id="transfer-width" step="1"><span>像素</span>
              </div>
            </div>
          </section>
        </div>
        <div id="transfer-line-properties" hidden>
          <section class="platform-section transfer-section">
            <h2 class="section-title">线路信息</h2>
            <div class="field">
              <label for="transfer-line-name">线路编号或名称</label>
              <input id="transfer-line-name" type="text" maxlength="40">
            </div>
            <div class="field">
              <label for="transfer-line-color-value">线路色</label>
              <div id="transfer-line-color-picker"></div>
            </div>
          </section>
          <section class="platform-section transfer-section" id="line-pattern-section"></section>
        </div>
        <div id="transfer-arrow-properties" hidden>
          <section class="platform-section transfer-section">
            <h2 class="section-title" id="transfer-direction-heading">箭头方向</h2>
            <div class="palette-grid direction-grid" id="transfer-directions" role="group" aria-labelledby="transfer-direction-heading"></div>
          </section>
        </div>
        <div id="transfer-label-properties" hidden>
          <section class="platform-section transfer-section">
            <h2 class="section-title">文字中的线路</h2>
            <div id="transfer-label-lines"></div>
          </section>
        </div>
        <section class="platform-section transfer-section" id="transfer-group-placement" hidden>
          <div id="transfer-group-alignment"><h2 class="section-title">本组对齐</h2></div>
          <div id="transfer-group-arrow-position"><h2 class="section-title">箭头位置</h2></div>
        </section>
      </div>
      <div class="transfer-export">
        <button type="button" class="btn btn-primary" id="transfer-export-image">导出 PNG</button>
        <button type="button" class="btn" id="transfer-export-vector">导出 SVG</button>
      </div>
    </aside>
  </div>

  <!-- 通知与对话框 -->
  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script src="js/core.js?v=public-181a8c8b1a69"></script>
  <script src="js/palettes.js?v=public-617b4fb22e1e"></script>
  <script src="js/palette-manager.js?v=public-71d85de854d0"></script>
  <script src="js/icons.js?v=public-8e9eb9f48086"></script>
  <script src="js/directions.js?v=e236a676ed91"></script>
  <script src="js/state.js?v=public-821e25ad8636"></script>
  <script src="js/render.js?v=public-02d87d9bea0d"></script>
  <script src="js/ui.js?v=public-bc12f3ec68d5"></script>
  <script src="js/clipboard.js?v=public-d58c305be636"></script>
  <script src="js/presets.js?v=public-e3eeae2acdc5"></script>
  <script src="js/storage.js?v=public-85ae228675bd"></script>
  <script src="js/exporters.js?v=public-56da7d254b51"></script>
  <script src="js/color-picker.js?v=01972a3cfee5"></script>
  <script src="js/panel.js?v=f39f97d708ec"></script>
  <script src="js/interact.js?v=b442a0d55219"></script>
  <script>
    if (new URLSearchParams(location.search).get('editor') === 'transfer') {
      document.title = '换乘标识生成器';
      document.body.classList.add('platform-page');
      document.getElementById('app').hidden = true;
      document.getElementById('transfer-editor').hidden = false;
      document.getElementById('transfer-modes').hidden = false;
      document.querySelector('.editor-navigation [aria-current]').removeAttribute('aria-current');
      document.querySelector('.editor-navigation a[href="index.html?editor=transfer"]').setAttribute('aria-current', 'page');
    }
  </script>
  <script src="js/main.js?v=9a2ef38c901c"></script>
  <script src="assets/platform-patterns.js?v=03d881cc86be"></script>
  <script src="js/platform/patterns.js?v=05b46d9c241d"></script>
  <script src="js/transfer/state.js?v=619cd2b42adb"></script>
  <script src="js/transfer/render.js?v=386aa4d750d4"></script>
  <script src="js/transfer/main.js?v=42593b13fd60"></script>
</body>
</html>
