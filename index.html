<!DOCTYPE html>
<!-- Modified by PrisamaX0124, 2026-10-05: guidance sign and platform editor enhancements; see docs/fork-changes.md. -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1100">
  <title>CRT标识编辑器 - 导向标识</title>
  <script src="js/editor-preferences.js?v=1"></script>
  <link rel="stylesheet" href="style.css?v=restored-color-picker">
  <link rel="stylesheet" href="platform.css?v=restored-editor">
  <link rel="stylesheet" href="transfer.css?v=94cae356a9f5">
  <link rel="stylesheet" href="project-dialog.css?v=20261125">
  <link rel="stylesheet" href="image-upload.css?v=39bea1cc93e6">
  <link rel="stylesheet" href="editor-interface.css?v=restored-editor">
</head>
<body class="editor-page" data-editor="guidance">

  <!-- 字体加载指示 -->
  <div id="loading-overlay" hidden>
    <div class="loading-spinner"></div>
    <div id="loading-text">正在加载字体…</div>
  </div>

  <header class="editor-header">
    <div class="editor-header-content">
      <div class="editor-heading-actions">
        <nav class="editor-navigation" aria-label="切换编辑器">
          <button type="button" class="editor-switch" aria-expanded="false" aria-controls="editor-choices">
            <span>导向标识编辑器</span>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="editor-choices" id="editor-choices" hidden>
            <a href="index.html" aria-current="page">
              <span>导向标识</span>
              <img src="assets/editor-previews/guidance.png?v=5ad1811fd030" width="384" height="152" alt="">
            </a>
            <a href="index.html?editor=transfer">
              <span>换乘标识</span>
              <img src="assets/editor-previews/transfer.png?v=fb719a33cf0f" width="384" height="152" alt="">
            </a>
            <a href="platform.html">
              <span>站台标识</span>
              <img src="assets/editor-previews/platform.png" width="384" height="152" alt="">
            </a>
          </div>
        </nav>
        <button type="button" class="btn project-entry" id="guidance-project-open" data-control-icon="property-project" aria-haspopup="dialog" aria-controls="guidance-project-dialog">我的项目</button>
      </div>
      <div class="project-header-actions">
        <div class="editor-help-actions">
          <button type="button" class="editor-header-action" data-open-tutorial aria-haspopup="dialog" aria-label="使用教程" title="使用教程">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.3a2.7 2.7 0 0 1 5.3.6c0 1.9-2.7 2-2.7 3.8m0 2.7h.01"/></svg><span>教程</span>
          </button>
          <button type="button" class="editor-header-action" data-editor-settings aria-label="设置" aria-haspopup="dialog" aria-controls="editor-settings" title="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></svg><span>设置</span>
          </button>
        </div>
        <a class="editor-repository" href="https://github.com/PrisamaX0124/CRT-Sign-Web-Editor" target="_blank" rel="noopener" aria-label="在新标签页打开 GitHub 仓库" title="GitHub 仓库">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg>
          <span class="repository-arrow" aria-hidden="true">&gt;</span>
        </a>
      </div>
      <nav class="mode-tabs" id="transfer-modes" aria-label="换乘标识版式" hidden>
        <button type="button" data-transfer-mode="guidance" aria-pressed="true">版式 A</button>
        <button type="button" data-transfer-mode="separate" aria-pressed="false">版式 B</button>
      </nav>
    </div>
  </header>

  <div id="app" class="editor-workspace">

    <!-- ══ 左栏：元素选择区 ══ -->
    <aside id="left-panel" class="editor-left" aria-labelledby="guidance-library-heading">
      <div class="panel-header">
        <h2 class="panel-title" id="guidance-library-heading">元素库</h2>
        <button type="button" class="icon-btn collapse-btn" id="left-collapse" data-panel-toggle data-control-icon="panel-left" aria-controls="left-panel" aria-expanded="true" aria-label="收起元素库" title="收起元素库"></button>
      </div>
      <div class="panel-body" id="palette">
        <!-- panel.js 填充：分类元素卡片 + 预设 -->
      </div>
    </aside>
    <button type="button" id="left-expander" class="expander" data-panel-toggle data-control-icon="panel-right" aria-controls="left-panel" aria-expanded="false" aria-label="展开元素库" title="展开元素库" hidden></button>

    <!-- ══ 中栏：SVG 编辑区 ══ -->
    <main id="center-panel" class="editor-center">
      <div class="preview-toolbar">
        <div class="preview-heading">
          <strong class="project-preview-title"><button type="button" id="guidance-project-current" class="project-title-button" data-control-icon="property-edit" aria-haspopup="dialog" disabled>未命名项目</button><span aria-hidden="true"> / </span><span>导向标识</span></strong>
          <span id="guidance-preview-dimensions" class="preview-dimensions"></span>
        </div>
        <div class="preview-toolbar-actions">
          <div id="edit-actions" class="clipboard-tools" role="toolbar" aria-label="选择与剪贴板">
            <button type="button" data-edit-action="select-all" data-control-icon="select-all" aria-label="全选元素" aria-keyshortcuts="Control+A Meta+A">
              <span class="control-hint" aria-hidden="true"><kbd>Ctrl / ⌘</kbd><kbd>A</kbd><span>全选</span></span>
            </button>
            <button type="button" data-edit-action="copy" data-control-icon="copy" aria-label="复制选中元素" aria-keyshortcuts="Control+C Meta+C" disabled>
              <span class="control-hint" aria-hidden="true"><kbd>Ctrl / ⌘</kbd><kbd>C</kbd><span>复制</span></span>
            </button>
            <button type="button" data-edit-action="cut" data-control-icon="cut" aria-label="剪切选中元素" aria-keyshortcuts="Control+X Meta+X" disabled>
              <span class="control-hint" aria-hidden="true"><kbd>Ctrl / ⌘</kbd><kbd>X</kbd><span>剪切</span></span>
            </button>
            <button type="button" data-edit-action="paste" data-control-icon="paste" aria-label="粘贴元素" aria-keyshortcuts="Control+V Meta+V">
              <span class="control-hint" aria-hidden="true"><kbd>Ctrl / ⌘</kbd><kbd>V</kbd><span>粘贴</span></span>
            </button>
          </div>
          <div class="element-position-controls" role="group" aria-label="移动元素">
            <button type="button" id="guidance-position-mode" aria-pressed="true" title="可左右拖动或移到其他行，关闭后按顺序排列">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M8 7l-5 5 5 5m8-10 5 5-5 5"/></svg>
              自由移动
            </button>
            <button type="button" id="guidance-alignment" aria-pressed="true" title="自由移动时自动吸附对齐">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h4v8a3 3 0 0 0 6 0V5h4v8a7 7 0 0 1-14 0ZM5 9h4m6 0h4"/></svg>
              吸附对齐
            </button>
          </div>
          <div class="history-actions" role="group" aria-label="撤销与重做">
            <button type="button" id="guidance-undo" class="icon-btn" data-control-icon="undo" title="撤销" aria-label="撤销" aria-keyshortcuts="Control+Z Meta+Z" disabled></button>
            <button type="button" id="guidance-redo" class="icon-btn" data-control-icon="redo" title="重做" aria-label="重做" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z" disabled></button>
          </div>
        </div>
      </div>
      <div id="canvas-scroll" class="preview-zoom-viewport">
        <div id="canvas-area" class="preview-zoom-stage">
          <div id="canvas-wrap">
            <svg id="sign-svg" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="sign-overlay">
              <!-- interact.js 填充：行手柄/行按钮/拖放指示器 -->
            </div>
            <div id="empty-hint" hidden><span>点击左侧元素，或拖到牌面上</span></div>
          </div>
          <button id="add-row-btn" title="在底部添加新行">＋ 添加行</button>
        </div>
      </div>

      <div id="element-toolbar" class="floating-toolbar" role="toolbar" aria-label="元素快捷操作" hidden inert></div>
      <footer class="editor-footer">
        <div class="editor-footer-status">
          <div class="project-save" id="guidance-save">
            <span role="status">本地自动保存</span>
            <button type="button" hidden>备份项目 JSON</button>
          </div>
          <span id="selection-status" class="selection-status" role="status"></span>
        </div>
        <div class="editor-footer-controls">
          <details class="footer-shortcuts">
            <summary>快捷键</summary>
            <div class="shortcut-hints" aria-label="选择快捷键">
              <span class="shortcut-hint"><kbd>Ctrl / ⌘</kbd><span class="shortcut-description">单击加选</span></span>
              <span class="shortcut-hint"><kbd>Shift</kbd><span class="shortcut-description">单击范围选择</span></span>
              <span class="shortcut-hint"><kbd>Esc</kbd><span class="shortcut-description">取消选择</span></span>
              <span class="shortcut-hint"><kbd>滚轮</kbd><span class="shortcut-description">放大或缩小</span></span>
              <span class="shortcut-hint"><kbd>Shift + 滚轮</kbd><span class="shortcut-description">横向移动</span></span>
              <span class="shortcut-hint"><kbd>双击空白处</kbd><span class="shortcut-description">适应画布</span></span>
            </div>
          </details>
          <div class="preview-zoom" id="guidance-zoom" role="group" aria-label="画布位置和缩放"></div>
        </div>
      </footer>
    </main>

    <!-- ══ 右栏：属性 / 导出 ══ -->
    <button type="button" id="right-expander" class="expander expander-right" data-panel-toggle data-control-icon="panel-left" aria-controls="right-panel" aria-expanded="false" aria-label="展开属性面板" title="展开属性面板" hidden></button>
    <aside id="right-panel" class="editor-right" aria-labelledby="right-panel-title">
      <div class="panel-header property-header">
        <div class="property-heading-row">
          <div class="panel-heading">
            <button class="icon-btn" id="close-element-btn" title="返回标识牌设置" aria-label="返回标识牌设置" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <span class="panel-title" id="right-panel-title" tabindex="-1">标识牌设置</span>
          </div>
          <button type="button" class="icon-btn collapse-btn" id="right-collapse" data-panel-toggle data-control-icon="panel-right" aria-controls="right-panel" aria-expanded="true" aria-label="收起属性面板" title="收起属性面板"></button>
        </div>
        <div class="property-tabs" role="tablist" aria-labelledby="right-panel-title"></div>
      </div>
      <div class="panel-body" id="right-panel-body">
        <!-- panel.js 填充：标识牌设置 / 元素属性 / 预设预览 -->
      </div>
      <div class="image-export" role="group" aria-label="图片导出">
        <div class="image-export-primary">
          <button type="button" class="btn btn-primary" id="guidance-export-png">导出 PNG</button>
          <select id="guidance-png-scale" aria-label="PNG 倍率" title="PNG 倍率"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </div>
        <div class="image-export-secondary"><button type="button" class="btn" id="guidance-export-svg">导出 SVG</button></div>
      </div>
      <input type="file" id="guidance-project-file" accept=".json,application/json" hidden>
    </aside>

  </div>

  <div id="transfer-editor" class="editor-workspace" hidden>
    <aside class="platform-stations editor-left" id="transfer-content" aria-labelledby="transfer-content-heading">
      <div class="panel-header">
        <h2 class="panel-title" id="transfer-content-heading">线路与元素</h2>
        <button type="button" class="icon-btn collapse-btn" data-panel-toggle data-control-icon="panel-left" aria-controls="transfer-content" aria-expanded="true" aria-label="收起线路与元素" title="收起线路与元素"></button>
      </div>
      <div class="library-tabs" aria-label="内容与预设">
        <button type="button" data-transfer-library="elements" aria-pressed="true">线路</button>
        <button type="button" data-transfer-library="presets" aria-pressed="false">预设</button>
      </div>
      <div class="panel-body" id="transfer-element-library">
        <section class="platform-section transfer-section">
          <h3 class="section-title" id="transfer-arrangement-heading">线路分组</h3>
          <div id="transfer-arrangements" role="group" aria-labelledby="transfer-arrangement-heading"></div>
        </section>
        <section class="platform-section transfer-section">
          <h3 class="section-title">牌面元素</h3>
          <div id="transfer-groups"></div>
        </section>
      </div>
      <div class="panel-body" id="transfer-preset-list" hidden></div>
    </aside>
    <button type="button" class="expander" data-panel-toggle data-control-icon="panel-right" aria-controls="transfer-content" aria-expanded="false" aria-label="展开线路与元素" title="展开线路与元素" hidden></button>
    <main class="platform-preview editor-center" id="transfer-preview" aria-label="换乘标识预览">
      <div class="preview-toolbar">
        <div class="preview-heading">
          <strong id="transfer-preview-title"></strong>
          <span id="transfer-dimensions" class="preview-dimensions"></span>
        </div>
        <div class="preview-toolbar-actions">
          <div class="history-actions" role="group" aria-label="撤销与重做">
            <button type="button" id="transfer-undo" class="icon-btn" data-control-icon="undo" title="撤销" aria-label="撤销" disabled></button>
            <button type="button" id="transfer-redo" class="icon-btn" data-control-icon="redo" title="重做" aria-label="重做" disabled></button>
          </div>
        </div>
      </div>
      <div class="transfer-preview-scroll preview-zoom-viewport" id="transfer-preview-scroll">
        <div class="preview-zoom-stage">
          <div class="transfer-paper">
            <svg id="transfer-sign" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="换乘标识牌上的元素"></svg>
          </div>
        </div>
      </div>
      <div id="transfer-element-toolbar" class="floating-toolbar" role="toolbar" aria-label="元素快捷操作" hidden inert>
        <span id="transfer-toolbar-title"></span>
        <button type="button" id="transfer-tool-edit">编辑</button>
        <button type="button" id="transfer-tool-pattern">启用底纹</button>
        <button type="button" id="transfer-tool-turn-counterclockwise" data-turn-step="-1" data-control-icon="turn-counterclockwise" title="逆时针转向 45°" aria-label="逆时针转向 45°" hidden></button>
        <button type="button" id="transfer-tool-turn" data-turn-step="1" data-control-icon="turn-clockwise" title="顺时针转向 45°" aria-label="顺时针转向 45°" hidden></button>
        <div id="transfer-tool-alignment" hidden></div>
        <div id="transfer-tool-arrow-position" hidden></div>
      </div>
      <footer class="editor-footer">
        <div class="editor-footer-status">
          <div class="project-save" id="transfer-save">
            <span role="status">本地自动保存</span>
            <button type="button" hidden>备份项目 JSON</button>
          </div>
        </div>
        <div class="editor-footer-controls">
          <details class="footer-shortcuts">
            <summary>快捷键</summary>
            <div class="shortcut-hints" aria-label="选择快捷键">
              <span class="shortcut-hint"><kbd>Esc</kbd><span class="shortcut-description">取消选择</span></span>
              <span class="shortcut-hint"><kbd>滚轮</kbd><span class="shortcut-description">放大或缩小</span></span>
              <span class="shortcut-hint"><kbd>Shift + 滚轮</kbd><span class="shortcut-description">横向移动</span></span>
              <span class="shortcut-hint"><kbd>双击空白处</kbd><span class="shortcut-description">适应画布</span></span>
            </div>
          </details>
          <div class="preview-zoom" id="transfer-zoom" role="group" aria-label="画布位置和缩放"></div>
        </div>
      </footer>
    </main>
    <button type="button" class="expander expander-right" data-panel-toggle data-control-icon="panel-left" aria-controls="transfer-properties" aria-expanded="false" aria-label="展开属性面板" title="展开属性面板" hidden></button>
    <aside class="platform-properties editor-right" id="transfer-properties" aria-labelledby="transfer-heading">
      <header class="panel-header property-header">
        <div class="property-heading-row">
          <div class="panel-heading">
            <button type="button" class="icon-btn" id="transfer-return" title="返回标识牌设置" aria-label="返回标识牌设置" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h1 class="panel-title" id="transfer-heading" tabindex="-1">标识牌设置</h1>
          </div>
          <button type="button" class="icon-btn collapse-btn" data-panel-toggle data-control-icon="panel-right" aria-controls="transfer-properties" aria-expanded="true" aria-label="收起属性面板" title="收起属性面板"></button>
        </div>
        <div class="property-tabs" role="tablist" aria-labelledby="transfer-heading"></div>
      </header>
      <div class="panel-body" id="transfer-property-scroll">
        <div id="transfer-settings">
          <section class="panel-section platform-section transfer-output-settings" data-property-tab="edit">
            <h2 class="section-title">颜色与尺寸</h2>
            <div class="field">
              <label for="transfer-palette">城市配色</label>
              <select id="transfer-palette"></select>
            </div>
            <div class="field">
              <label for="transfer-width">标识牌宽度</label>
              <div class="transfer-width-setting">
                <input type="number" id="transfer-width" step="1"><span>像素</span>
              </div>
            </div>
          </section>
          <section class="panel-section platform-section" data-property-tab="appearance">
            <h2 class="section-title">牌面灰框</h2>
            <div class="field">
              <label for="transfer-frame-width">灰框宽度（px）</label>
              <input type="number" id="transfer-frame-width" min="0" step="1" aria-describedby="transfer-frame-hint">
              <p class="hint-text" id="transfer-frame-hint">灰框从牌面边缘向内绘制，宽度为 0 时隐藏。</p>
            </div>
            <div class="field">
              <label for="transfer-frame-color-value">灰框颜色</label>
              <div id="transfer-frame-color-picker"></div>
            </div>
          </section>
        </div>
        <div id="transfer-line-properties" hidden>
          <section class="panel-section platform-section" data-property-tab="edit">
            <h2 class="section-title">线路信息</h2>
            <div class="field">
              <label for="transfer-line-name">线路编号或名称</label>
              <input id="transfer-line-name" type="text" maxlength="40">
            </div>
            <div class="field" hidden>
              <label for="transfer-line-english-name">英文名称</label>
              <input id="transfer-line-english-name" type="text" maxlength="80">
            </div>
            <div class="field line-pattern-heading" hidden>
              <span class="section-title" id="transfer-line-large-name-label">放大线路名</span>
              <button type="button" id="transfer-line-large-name" class="platform-switch" role="switch" aria-labelledby="transfer-line-large-name-label" aria-checked="false"><span aria-hidden="true"></span></button>
            </div>
            <div class="field">
              <label for="transfer-line-color-value">线路色</label>
              <div id="transfer-line-color-picker"></div>
            </div>
          </section>
          <section class="panel-section platform-section" id="line-pattern-section" data-property-tab="appearance"></section>
        </div>
        <div id="transfer-arrow-properties" hidden>
          <section class="panel-section platform-section" data-property-tab="edit">
            <h2 class="section-title" id="transfer-direction-heading">箭头方向</h2>
            <div class="palette-grid direction-grid" id="transfer-directions" role="group" aria-labelledby="transfer-direction-heading"></div>
          </section>
        </div>
        <div id="transfer-label-properties" hidden>
          <section class="panel-section platform-section" data-property-tab="edit">
            <h2 class="section-title">文字中的线路</h2>
            <div id="transfer-label-lines"></div>
          </section>
        </div>
        <section class="panel-section platform-section" id="transfer-group-placement" data-property-tab="edit" hidden>
          <div id="transfer-group-alignment"><h2 class="section-title">本组对齐</h2></div>
          <div id="transfer-group-arrow-position"><h2 class="section-title">箭头位置</h2></div>
        </section>
        <section class="panel-section platform-section" data-property-tab="project">
          <div class="field-pair">
            <button type="button" class="btn" id="transfer-export-project">导出项目 JSON</button>
            <button type="button" class="btn" id="transfer-import-project">导入项目 JSON</button>
          </div>
          <div id="transfer-preset-actions"></div>
        </section>
      </div>
      <div class="image-export" role="group" aria-label="图片导出">
