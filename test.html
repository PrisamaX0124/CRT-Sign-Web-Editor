  <script>
    var tests = [];
    function test(name, fn) { tests.push({ name: name, fn: fn }); }
    function assert(cond, msg) { if (!cond) throw new Error(msg || '断言失败'); }
    function assertEqual(a, e, msg) {
      if (JSON.stringify(a) !== JSON.stringify(e)) {
        throw new Error((msg || '值不相等') + '\n  期望: ' + JSON.stringify(e) + '\n  实际: ' + JSON.stringify(a));
      }
    }
    function svgOf(node) { return new XMLSerializer().serializeToString(node); }

    var fixture = document.getElementById('fixture');
    var measure = SignCore.createCanvasMeasurer();

    // ─── 元素 SVG 结构 ─────────────────────────────────

    test('Arrow 渲染：3 个 polygon（两头一柄）+ hitbox，八方向可用', function () {
      var el = SignState.createElement('arrow', { direction: 'left' });
      var r = SignRender.renderElement(el, 256, measure);
      assertEqual(r.node.querySelectorAll('polygon').length, 3, '两个箭头头 + 箭柄');
      assertEqual(r.node.querySelectorAll('rect').length, 1, 'hitbox');
      assert(r.width > 0, '宽度为正');
      ['left-up', 'right-up', 'right-down', 'left-down'].forEach(function (d) {
        var diag = SignState.createElement('arrow', { direction: d });
        var rd = SignRender.renderElement(diag, 256, measure);
        assertEqual(rd.node.querySelectorAll('polygon').length, 3, d + ' 渲染 3 个 polygon');
        assertEqual(rd.width, r.width, d + ' 宽度与轴 向一致');
      });
    });

    test('Arrow 四个方向几何不同且宽度一致', function () {
      var widths = {};
      ['up', 'down', 'left', 'right'].forEach(function (d) {
        var el = SignState.createElement('arrow', { direction: d });
        var r = SignRender.renderElement(el, 128, measure);
        widths[d] = Math.round(r.width * 100) / 100;
      });
      assertEqual(widths.up, widths.left, '上下与左右同宽');
      assertEqual(widths.right, widths.left, '镜像同宽');
      assertEqual(widths.down, widths.up, '上下同宽');
    });

    test('BilingualText 渲染：中英两个 text，加粗切换 font-weight', function () {
      var el = SignState.createElement('bilingual-text', { textZh: '世纪大道', textEn: 'Century Avenue' });
      var r = SignRender.renderElement(el, 200, measure);
      var texts = r.node.querySelectorAll('text');
      assertEqual(texts.length, 2);
      assertEqual(texts[0].textContent, '世纪大道');
      assertEqual(texts[1].textContent, 'Century Avenue');
      assertEqual(texts[0].getAttribute('font-weight'), '400');
      var bold = SignState.createElement('bilingual-text', { textZh: '站', textEn: 'St', bold: true });
      var r2 = SignRender.renderElement(bold, 200, measure);
      assertEqual(r2.node.querySelectorAll('text')[0].getAttribute('font-weight'), '700');
    });

    test('BilingualText 对齐：三种对齐文本都不越出内容盒', function () {
      ['left', 'center', 'right'].forEach(function (align) {
        var el = SignState.createElement('bilingual-text', {
          textZh: '世纪大道', textEn: 'Century Avenue', align: align,
        });
        var r = SignRender.renderElement(el, 200, measure);
        var mt = SignRender.elementMetrics(el, 200, measure);
        var texts = r.node.querySelectorAll('text');
        assertEqual(texts.length, 2);
        var contentRight = mt.pad.l + mt.textW;
        // 英文左右对齐有 s/30 光学缩进（sign_jr 同款）：左对齐右移、右对齐左移，
        // 允许英文在对应方向多出这一缩进；中文恒在内容盒内
        var indent = mt.pad.size / 30;
        for (var i = 0; i < texts.length; i++) {
          var isZh = texts[i].textContent === el.props.textZh;
          var w = isZh ? mt.zhW : mt.enW;
          var x = parseFloat(texts[i].getAttribute('x'));
          var allow = (align !== 'center' && !isZh) ? indent : 0;
          assert(x >= mt.pad.l - allow - 0.01, align + ' 文本左缘越界 x=' + x);
          assert(x + w <= contentRight + allow + 0.01, align + ' 文本右缘越界 ' + (x + w) + ' > ' + contentRight);
        }
      });
    });

    test('SmallBilingualText 渲染：字号与出口 Exit 标签一致', function () {
      var small = SignState.createElement('small-bilingual-text', {
        textZh: '出口', textEn: 'Exit',
      });
      var exit = SignState.createElement('exit', { code: '1' });
      var smallRendered = SignRender.renderElement(small, 200, measure);
      var exitRendered = SignRender.renderElement(exit, 200, measure);
      var smallTexts = smallRendered.node.querySelectorAll('text');
      var exitTexts = exitRendered.node.querySelectorAll('text');
      assertEqual(smallTexts[0].getAttribute('font-size'), exitTexts[1].getAttribute('font-size'), '中文字号一致');
      assertEqual(smallTexts[1].getAttribute('font-size'), exitTexts[2].getAttribute('font-size'), '英文字号一致');
      assertEqual(smallTexts[0].getAttribute('y'), exitTexts[1].getAttribute('y'), '中文基线一致');
      assertEqual(smallTexts[1].getAttribute('y'), exitTexts[2].getAttribute('y'), '英文基线一致');
    });

    test('NumberLine 单位/首位「1」到色条的间距恒定（真实字体回归）', function () {
      function firstGap(number) {
        var el = SignState.createElement('number-line', {
          lines: [{ number: number, color: '#E4002B' }],
        });
        var r = SignRender.renderElement(el, 256, measure);
        fixture.appendChild(r.node);
        var stripe = r.node.querySelector('rect');
        var texts = r.node.querySelectorAll('text');
        var fontSize = 256 * 0.6 * 1.3;
        var ctx = document.createElement('canvas').getContext('2d');
        ctx.font = '400 ' + fontSize + 'px ' + SignCore.FONT_NUM;
        var tm = ctx.measureText(texts[0].textContent);
        var inkLeft = parseFloat(texts[0].getAttribute('x')) - tm.width / 2 - tm.actualBoundingBoxLeft;
        var gap = inkLeft - (parseFloat(stripe.getAttribute('x')) + parseFloat(stripe.getAttribute('width')));
        fixture.removeChild(r.node);
        return gap;
      }
      var gapSingle = firstGap('1');
      var gapDouble = firstGap('11');
      assert(Math.abs(gapSingle - gapDouble) < 1.5,
        '「1」到色条间距应恒定：单位 ' + gapSingle + ' vs 两位 ' + gapDouble);
      // 右缘对称：「1」墨区右缘 → 「号线」标签左缘的间距同样不随位数变化
      function labelGapOf(number) {
        var el = SignState.createElement('number-line', {
          lines: [{ number: number, color: '#E4002B' }],
        });
        var mt = SignRender.elementMetrics(el, 256, measure);
        var r = SignRender.renderElement(el, 256, measure);
        fixture.appendChild(r.node);
        var texts = r.node.querySelectorAll('text');
        var fontSize = 256 * 0.6 * 1.3;
        var ctx = document.createElement('canvas').getContext('2d');
        ctx.font = '400 ' + fontSize + 'px ' + SignCore.FONT_NUM;
        var last = texts[texts.length - 3] || texts[0]; // 最后一个数字 text（跳过 号线/Line）
        var tm = ctx.measureText(last.textContent);
        var inkRight = parseFloat(last.getAttribute('x')) - tm.width / 2 + tm.actualBoundingBoxRight;
        var label = Array.prototype.find.call(texts, function (t) { return t.textContent === '号线'; });
        var labelInkLeft = parseFloat(label.getAttribute('x')); // 号线 text 默认起点锚定
        fixture.removeChild(r.node);
        return labelInkLeft - inkRight;
      }
      var lgSingle = labelGapOf('1');
      var lgDouble = labelGapOf('11');
      assert(Math.abs(lgSingle - lgDouble) < 1.5,
        '「1」到「号线」间距应恒定：单位 ' + lgSingle + ' vs 两位 ' + lgDouble);
    });

    test('NumberLine 渲染：色条 rect + 数字 text + 号线/Line 标签', function () {      var el = SignState.createElement('number-line', {
        lines: [{ number: '3', color: '#FCD600' }, { number: '14', color: '#626020' }, { number: '22', color: '#871C2B' }],
      });
      var r = SignRender.renderElement(el, 256, measure);
      assertEqual(r.node.querySelectorAll('rect').length, 4, '三条色条 + hitbox');
      var texts = Array.prototype.slice.call(r.node.querySelectorAll('text'));
      assertEqual(texts.length, 7, '3 + 1 + 4 + 2 + 2 逐位 + 号线 + Line');
      // 两位数仍用常规 Frutiger（不再切窄体），间距按墨区排版
      var one = texts.filter(function (t) { return t.textContent === '1'; })[0];
      var four = texts.filter(function (t) { return t.textContent === '4'; })[0];
      assert(one && four, '两位数逐字绘制');
      assert(one.getAttribute('font-family').indexOf('Frutiger Condensed') === -1, '两位数用常规 Frutiger');
      var rowHeight = 256, s = rowHeight * 0.6, padL = rowHeight * 0.2;
      var fontSize = s * 1.3;
      var ctx = document.createElement('canvas').getContext('2d');
      ctx.font = '400 ' + fontSize + 'px ' + SignCore.FONT_NUM;
      function inkLeftOf(node) {
        var tm = ctx.measureText(node.textContent);
        return parseFloat(node.getAttribute('x')) - tm.width / 2 - tm.actualBoundingBoxLeft;
      }
      function inkRightOf(node) {
        var tm = ctx.measureText(node.textContent);
        return parseFloat(node.getAttribute('x')) - tm.width / 2 + tm.actualBoundingBoxRight;
      }
      // 每条线路自己的色条右缘（'3'→第0条，'14'→第1条，'22'→第2条）
      var stripeRights = Array.prototype.slice.call(r.node.querySelectorAll('rect')).slice(0, 3)
        .map(function (r2) { return parseFloat(r2.getAttribute('x')) + parseFloat(r2.getAttribute('width')); });
      var entryOf = { '3': 0, '1': 1, '4': 1, '2': 2 };
      // 回归：首位数字墨区不得嵌入左侧色条
      ['1', '2'].forEach(function (ch) {
        var node = texts.filter(function (t) { return t.textContent === ch; })[0];
        assert(inkLeftOf(node) >= stripeRights[entryOf[ch]] - 1,
          ch + ' 墨区左缘 ' + inkLeftOf(node) + ' 应 ≥ ' + stripeRights[entryOf[ch]]);
      });
      // 墨区间距设计：首位「1」的墨区间距与单位数「3」一致（不再因墨窄而显得更远）
      var three = texts.filter(function (t) { return t.textContent === '3'; })[0];
      var gap1 = inkLeftOf(one) - stripeRights[1];
      var gap3 = inkLeftOf(three) - stripeRights[0];
      assert(Math.abs(gap1 - gap3) < 1.5, '"1"首位墨区间距应与"3"一致 ' + gap1 + ' vs ' + gap3);
      // 相邻数字墨区间距统一（1→4 与 2→2 相同）
      function inkW(ch) {
        var tm = ctx.measureText(ch);
        return tm.actualBoundingBoxRight + tm.actualBoundingBoxLeft;
      }
      var two2 = texts.filter(function (t) { return t.textContent === '2'; });
      var gap14 = inkLeftOf(four) - (inkLeftOf(one) + inkW('1'));
      var gap22 = inkLeftOf(two2[1]) - (inkLeftOf(two2[0]) + inkW('2'));
      assert(Math.abs(gap14 - gap22) < 1.5, '数字墨区间距应统一 ' + gap14 + ' vs ' + gap22);
      // 数字与「号线」墨区顶对齐（墨区顶 = 基线 y 属性 − 实测墨区上升高；
      // 注意 SVG getBBox 对 text 返回行盒而非墨区，不能用于此项断言）
      var zhSize = s * 0.75 * SignRender.ZH_FONT_RATIO;
      var digitInkTop = parseFloat(four.getAttribute('y')) - measure.ascent('4', SignCore.FONT_NUM, 400, fontSize);
      var hao = texts.filter(function (t) { return t.textContent === '号线'; })[0];
      var zhInkTop = parseFloat(hao.getAttribute('y')) - measure.ascent('号线', SignCore.FONT_ZH, 400, zhSize);
      assert(Math.abs(digitInkTop - zhInkTop) < 1.5, '数字与号线墨区顶对齐 ' + digitInkTop + ' vs ' + zhInkTop);
    });

    test('TextLine 渲染：贯穿色条 + 大字 + 线/英文名标签', function () {
      var el = SignState.createElement('text-line', { text: '环', textEn: 'Loop Line', blockColor: '#461D84' });
      var r = SignRender.renderElement(el, 256, measure);
      var mt = SignRender.elementMetrics(el, 256, measure);
      var rects = r.node.querySelectorAll('rect');
      assertEqual(rects.length, 2, '色条 + hitbox');
      var stripe = rects[0];
      assertEqual(stripe.getAttribute('fill'), '#461D84');
      assertEqual(parseFloat(stripe.getAttribute('height')), mt.stripeH, '色条贯穿到行底');
      var texts = r.node.querySelectorAll('text');
      assertEqual(texts.length, 3, '大字 + 线 + 英文名');
      assertEqual(texts[0].textContent, '环');
      assert(texts[0].getAttribute('font-family').indexOf('MiSans') !== -1, 'MiSans大文本');
      assertEqual(texts[0].getAttribute('fill'), '#000000', '大字用文字颜色（同数字线路）');
      assertEqual(texts[1].textContent, '线');
      assertEqual(texts[2].textContent, 'Loop Line');
      assertEqual(r.width, mt.width);
      // 布局盒级间距：环两侧各一个 gap（getBBox x/width 为 advance 盒）
      fixture.appendChild(r.node);
      var big = texts[0].getBBox();
      var zh = texts[1].getBBox();
      var box = stripe.getBBox();
      var gapL = big.x - (box.x + box.width);
      var gapR = zh.x - (big.x + big.width);
      assert(Math.abs(gapL - gapR) < 2, '环两侧间距相等 ' + gapL + ' vs ' + gapR);
      // 墨区顶对齐（y 属性 − 实测墨区上升高）
      var s = 256 * 0.6;
      var zhSize = s * 0.75 * SignRender.ZH_FONT_RATIO;
      var bigInkTop = parseFloat(texts[0].getAttribute('y')) - measure.ascent('环', SignCore.FONT_ZH, 400, s);
      var zhInkTop = parseFloat(texts[1].getAttribute('y')) - measure.ascent('线', SignCore.FONT_ZH, 400, zhSize);
      assert(Math.abs(bigInkTop - zhInkTop) < 1.5, '环与线墨区顶对齐 ' + bigInkTop + ' vs ' + zhInkTop);
      fixture.removeChild(r.node);
    });

    test('TextLine 平铺渲染（关闭下沉）：「线」同级字号完整线路名 + 英文在下，无「线」后缀', function () {
      var el = SignState.createElement('text-line', {
        text: '机场联络线', textEn: 'Airport Link Line', nameSink: false, blockColor: '#C5003E',
      });
      var r = SignRender.renderElement(el, 256, measure);
      var mt = SignRender.elementMetrics(el, 256, measure);
      var rects = r.node.querySelectorAll('rect');
      assertEqual(rects.length, 2, '色条 + hitbox');
      assertEqual(rects[0].getAttribute('fill'), '#C5003E', '色条颜色');
      var texts = r.node.querySelectorAll('text');
      assertEqual(texts.length, 2, '线路名 + 英文名，无「线」后缀');
      assertEqual(texts[0].textContent, '机场联络线');
      assertEqual(texts[1].textContent, 'Airport Link Line');
      var s = 256 * 0.6;
      var labelBox = s * 0.75; // 「线 / 英文名」标签的内容盒高
      assert(Math.abs(mt.label.zhSize - labelBox * SignRender.ZH_FONT_RATIO) < 1e-9, 'metrics 中文字号 = 「线」标签字号');
      assert(Math.abs(mt.label.enSize - labelBox * SignRender.EN_FONT_RATIO) < 1e-9, 'metrics 英文字号 = 标签英文字号');
      assertEqual(parseFloat(texts[0].getAttribute('font-size')), mt.label.zhSize, '渲染字号 = metrics 中文字号');
      assertEqual(parseFloat(texts[1].getAttribute('font-size')), mt.label.enSize, '渲染字号 = metrics 英文字号');
      assert(parseFloat(texts[1].getAttribute('y')) > parseFloat(texts[0].getAttribute('y')), '英文在线路名下方');
      assertEqual(parseFloat(texts[0].getAttribute('x')), mt.labelX, '中文左缘 = 色条 + gap');
      assertEqual(parseFloat(texts[1].getAttribute('x')), mt.labelX, '英文左对齐中文');
      assertEqual(r.width, mt.width);
    });

    test('内容右对齐渲染：色块换边、编号换侧、标签盒内右对齐', function () {
      // 数字线路右对齐（输入两条线路，仅渲染第 1 条）
      var nl = SignState.createElement('number-line', {
        lines: [{ number: '4', color: '#E3002B' }, { number: '9', color: '#FCD600' }],
        align: 'right',
      });
      var r1 = SignRender.renderElement(nl, 256, measure);
      var mt1 = SignRender.elementMetrics(nl, 256, measure);
      var rects1 = r1.node.querySelectorAll('rect');
      assertEqual(rects1.length, 2, '1 色条 + hitbox（右对齐仅渲染第 1 条线路）');
      var texts1 = r1.node.querySelectorAll('text');
      assertEqual(texts1.length, 3, '单个数字 + 号线 + Line');
      assert(parseFloat(rects1[0].getAttribute('x')) > parseFloat(texts1[0].getAttribute('x')),
        '色条在编号右侧');
      assertEqual(parseFloat(rects1[0].getAttribute('x')), mt1.entries[0].stripeX, '色条 x = metrics');
      // 标签盒内右对齐：号线 右缘 = 标签盒右缘（朝向色块）
      var zhW = measure('号线', SignCore.FONT_ZH, 400, mt1.label.zhSize);
      assertEqual(parseFloat(texts1[1].getAttribute('x')), mt1.labelX + mt1.label.width - zhW, '号线右对齐');

      // 文字线路右对齐
      var tl = SignState.createElement('text-line', { text: '环', textEn: 'Loop Line', align: 'right' });
      var r2 = SignRender.renderElement(tl, 256, measure);
      var mt2 = SignRender.elementMetrics(tl, 256, measure);
      var stripe2 = r2.node.querySelectorAll('rect')[0];
      var big2 = r2.node.querySelectorAll('text')[0];
      assert(parseFloat(stripe2.getAttribute('x')) > parseFloat(big2.getAttribute('x')), '色条在大字右侧');
      assertEqual(parseFloat(stripe2.getAttribute('x')), mt2.stripeX, '色条 x = metrics');
      var xian = r2.node.querySelectorAll('text')[1];
      var zhW2 = measure('线', SignCore.FONT_ZH, 400, mt2.label.zhSize);
      assertEqual(parseFloat(xian.getAttribute('x')), mt2.labelX + mt2.label.width - zhW2, '线右对齐');
      assertEqual(r2.width, mt2.width);

      // 出口右对齐：编号移到「出口」右侧，基线不变
      var exL = SignState.createElement('exit', { code: '1' });
      var exR = SignState.createElement('exit', { code: '1', align: 'right' });
      var r3 = SignRender.renderElement(exR, 256, measure);
      var texts3 = r3.node.querySelectorAll('text');
      assertEqual(texts3[0].textContent, '1');
      assertEqual(texts3[1].textContent, '出口');
      assert(parseFloat(texts3[0].getAttribute('x')) > parseFloat(texts3[1].getAttribute('x')),
        '编号在「出口」右侧');
      var mtL = SignRender.elementMetrics(exL, 256, measure);
      var mtR = SignRender.elementMetrics(exR, 256, measure);
      assertEqual(mtR.codeBase, mtL.codeBase, '编号基线不变');
      assert(Math.abs(mtR.width - mtL.width) < 1e-9, '镜像后总宽不变');
      // 出口标签盒内右对齐：中英文右缘 = 标签盒右缘（朝向编号一侧）
      var zhWEx = measure('出口', SignCore.FONT_ZH, 400, mtR.label.zhSize);
      var enWEx = measure('Exit', SignCore.FONT_EN, 400, mtR.label.enSize);
      assertEqual(parseFloat(texts3[1].getAttribute('x')), mtR.labelX + mtR.label.width - zhWEx, '出口右对齐');
      assertEqual(parseFloat(texts3[2].getAttribute('x')), mtR.labelX + mtR.label.width - enWEx, 'Exit 右对齐');
    });

    test('BigNumber 光学居中：12 左右墨区间距相等（真实字体回归）', function () {
      var el = SignState.createElement('big-number', { text: '12' });
      var r = SignRender.renderElement(el, 256, measure);
      fixture.appendChild(r.node);
      var texts = r.node.querySelectorAll('text');
      var ctx = document.createElement('canvas').getContext('2d');
      var fs = texts[0].getAttribute('font-size');
      ctx.font = '400 ' + fs + 'px ' + texts[0].getAttribute('font-family');
      function inkLeft(t) {
        var tm = ctx.measureText(t.textContent);
        return parseFloat(t.getAttribute('x')) - tm.width / 2 - tm.actualBoundingBoxLeft;
      }
      function inkRight(t) {
        var tm = ctx.measureText(t.textContent);
        return parseFloat(t.getAttribute('x')) - tm.width / 2 + tm.actualBoundingBoxRight;
      }
      var elW = +r.node.querySelector('rect').getAttribute('width');
      var leftGap = inkLeft(texts[0]);
      var rightGap = elW - inkRight(texts[texts.length - 1]);
      assert(Math.abs(leftGap - rightGap) < 1.5,
        '左右墨区间距应相等 ' + leftGap + ' vs ' + rightGap);
      fixture.removeChild(r.node);
    });

    test('BigNumber 多位数：按墨区间距逐字排列（含 1 不松散）', function () {
      var el = SignState.createElement('big-number', { text: '14' });
      var r = SignRender.renderElement(el, 256, measure);
      var texts = r.node.querySelectorAll('text');
      assertEqual(texts.length, 2, '多位数逐字渲染');
      assertEqual(texts[0].textContent, '1');
      assertEqual(texts[1].textContent, '4');
      var s = 256 * 0.6;
      var fontSize = s * 1.3;
      var ctx = document.createElement('canvas').getContext('2d');
      ctx.font = '400 ' + fontSize + 'px ' + texts[0].getAttribute('font-family');
      function inkLeftOf(node) {
        var tm = ctx.measureText(node.textContent);
        return parseFloat(node.getAttribute('x')) - tm.width / 2 - tm.actualBoundingBoxLeft;
      }
      function inkRightOf(node) {
        var tm = ctx.measureText(node.textContent);
        return parseFloat(node.getAttribute('x')) - tm.width / 2 + tm.actualBoundingBoxRight;
      }
      function inkW(ch) {
        var tm = ctx.measureText(ch);
        return tm.actualBoundingBoxRight + tm.actualBoundingBoxLeft;
      }
      // 相邻墨区间距 = 基准墨区间距 g = lsb₃ + rsb₃（与数字线路同规则）
      var tm3 = ctx.measureText('3');
      var g = -tm3.actualBoundingBoxLeft + (tm3.width - tm3.actualBoundingBoxRight);
      var gap14 = inkLeftOf(texts[1]) - (inkLeftOf(texts[0]) + inkW('1'));
      assert(Math.abs(gap14 - g) < 1.5, '1→4 墨区间距应为基准值 ' + gap14 + ' vs ' + g);
      // 光学居中：首位墨区左空 = 末位墨区右空（「1」左字距大、「4」右字距小，平分）
      var padL = 256 * 0.2;
      var inkLeft0 = inkLeftOf(texts[0]);
      var inkRightLast = inkRightOf(texts[texts.length - 1]); // 末位墨区右缘 = x − adv/2 + abr
      var textW = r.width - padL * 2; // 内容盒宽（元素宽 − 左右内边距）
      var leftGap = inkLeft0 - padL;
      var rightGap = textW - (inkRightLast - padL);
      assert(Math.abs(leftGap - rightGap) < 1.5, '光学居中：左右墨区间距相等 ' + leftGap + ' vs ' + rightGap);
      assertEqual(r.width, SignRender.elementMetrics(el, 256, measure).width, '宽度 = metrics');
    });

    test('多行导出光栅化：保留独立背景色，分割线实际像素宽度不加倍', function () {
      var sign = SignState.updateSignSettings(SignState.addRow(SignState.createSign()), {
        width: 200, rowHeight: 100, frameWidth: 12,
      });
      sign = SignState.updateRowSettings(sign, sign.rows[0].id, { backgroundColor: '#E3002B' });
      sign = SignState.updateRowSettings(sign, sign.rows[1].id, { backgroundColor: '#0057B7' });
      var str = SignExporters.buildExportSVGString(sign, measure, {});
      var url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml' }));
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () {
          URL.revokeObjectURL(url);
          try {
            var canvas = document.createElement('canvas');
            canvas.width = 200; canvas.height = 200;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            function pixel(y) { return Array.from(ctx.getImageData(100, y, 1, 1).data).join(','); }
            assertEqual(pixel(50), '227,0,43,255', '第一行保持红色');
            assertEqual(pixel(150), '0,87,183,255', '第二行保持蓝色');
            var dividerPixels = 0, outerPixels = 0;
            for (var y = 80; y < 120; y++) if (pixel(y) === '74,74,74,255') dividerPixels++;
            for (var y = 0; y < 30; y++) if (pixel(y) === '74,74,74,255') outerPixels++;
            assertEqual(dividerPixels, 12, '共享分割线实际为12像素');
            assertEqual(dividerPixels, outerPixels, '分割线与外缘一样粗');
            canvas.toBlob(function (blob) {
              if (!blob) { reject(new Error('PNG blob 为空')); return; }
              assertEqual(blob.type, 'image/png');
              resolve();
            }, 'image/png');
          } catch (e) { reject(e); }
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('多行导出光栅化失败')); };
        img.src = url;
      });
    });

      assert(panto.classList.contains('active'), '合并色块点亮选中态');

      setCity('chengdu');
      assertEqual(swatchCount(), 53, '成都 = 30 线路 + 19 附加 + 4 通用');
      assertEqual(picker.querySelector('.cp-swatch[data-color="#7F9F3A"]').title, '蓉2号线');

      setCity('shanghai'); // 恢复默认偏好（localStorage 与编辑器同源共享）
      assertEqual(swatchCount(), 34, '切回上海');
      fixture.removeChild(picker);
    });

    // ─── PNG 导出（异步）───────────────────────────────

    test('导出 PNG：生成正确尺寸的 PNG Blob', function () {
      var state = SignState.createSign();
      state = SignState.addElement(state, state.rows[0].id,
        SignState.createElement('arrow', { direction: 'right' }));
      // 使用实际导出管线，包含矢量采样与编码。
      var str = SignExporters.buildExportSVGString(state, measure, {});
      var layout = SignRender.layoutSign(state, measure);
      return SignExporters.rasterizePNG(str, layout).then(async function (blob) {
        assert(blob.size > 1000, 'PNG 有实际内容'); assertEqual(blob.type, 'image/png');
        var bitmap = await createImageBitmap(blob);
        assertEqual(bitmap.width, Math.round(layout.width)); assertEqual(bitmap.height, Math.round(layout.height)); bitmap.close();
        // 原编辑器支持超过 8192px 的标识牌，采样不能缩窄或拒绝合法尺寸。
        var wide = SignState.updateSignSettings(state, { width: 16384 });
        var wideLayout = SignRender.layoutSign(wide, measure), wideSVG = SignExporters.buildExportSVGString(wide, measure, {});
        bitmap = await createImageBitmap(await SignExporters.rasterizePNG(wideSVG, wideLayout));
        assertEqual(bitmap.width, 16384); assertEqual(bitmap.height, Math.round(wideLayout.height)); bitmap.close();
      });
    });

    test('MiSans中英文，大文本与线路号/出入口编号使用Frutiger', function () {
      var C = SignCore, S = SignState, R = SignRender;
      [400, 600, 700].forEach(function (weight) {
        assert(document.fonts.check(weight + ' 32px "MiSans"', '人民广场 Station'), 'MiSans ' + weight + '已载入');
        assert(Array.from(document.fonts).some(function (face) { return face.family.replace(/["']/g, '') === 'MiSans' && +face.weight === weight && face.status === 'loaded'; }), 'MiSans ' + weight + '真实字体面已载入');
      });
      ['bilingual-text', 'small-bilingual-text', 'text-line'].forEach(function (type) {
        var texts = R.renderElement(S.createElement(type), 192, measure).node.querySelectorAll('text');
        Array.prototype.forEach.call(texts, function (t) { assert(t.getAttribute('font-family').indexOf('MiSans') === 1, type + '使用MiSans'); });
      });
      ['A', '14', '站A12'].forEach(function (text) {
        var el = S.createElement('big-number', { text: text });
        var mt = R.elementMetrics(el, 192, measure);
        var texts = R.renderElement(el, 192, measure).node.querySelectorAll('text');
        Array.prototype.forEach.call(texts, function (t) {
          assertEqual(t.getAttribute('font-family'), C.FONT_NUM, '大文本优先使用Frutiger');
          var top = parseFloat(t.getAttribute('y')) - measure.ascent(text, C.FONT_NUM, 400, mt.fontSize);
          assert(Math.abs(top - (mt.pad.t + mt.pad.size * R.INK_TOP_LEADING)) < 0.01, '大文本使用同一字体栈度量基线');
        });
      });
      ['number-line', 'entrance', 'exit'].forEach(function (type) {
        var texts = R.renderElement(S.createElement(type), 192, measure).node.querySelectorAll('text');
        assert(texts[0].getAttribute('font-family').indexOf('Frutiger') !== -1, type + '编号使用Frutiger');
        assert(texts[texts.length - 1].getAttribute('font-family').indexOf('MiSans') === 1, type + '标签使用MiSans');
      });
    });

    test('MiSans真实墨区：大号双语文本完整墨区居中、两行间距一致', function () {
      [false, true].forEach(function (bold) {
        ['人民广场', '虹桥火车站', '上海', '环'].forEach(function (zh) {
          var el = SignState.createElement('bilingual-text', { textZh: zh, textEn: 'Airport gyp', bold: bold });
          var mt = SignRender.elementMetrics(el, 192, measure);
          var texts = SignRender.renderElement(el, 192, measure).node.querySelectorAll('text');
          var zhTop = +texts[0].getAttribute('y') - measure.ascent(zh, SignCore.FONT_ZH, mt.weight, mt.zhSize);
          var enTop = +texts[1].getAttribute('y') - measure.ascent('Airport gyp', SignCore.FONT_EN, mt.weight, mt.enSize);
          var zhBottom = +texts[0].getAttribute('y') + measure.descent(zh, SignCore.FONT_ZH, mt.weight, mt.zhSize);
          var enBottom = +texts[1].getAttribute('y') + measure.descent('Airport gyp', SignCore.FONT_EN, mt.weight, mt.enSize);
          assert(Math.abs(zhTop + enBottom - 192) < 0.001, '上下墨区留白相等');
          assert(Math.abs(enTop - zhBottom - SignRender.ZH_EN_GAP * mt.pad.size) < 0.001, '英文间距由实际墨区计算');
        });
      });
    });

    test('图2回归：中心广场大号双语文本不再偏下，小号仍与组合标签顶齐', function () {
      var big = SignState.createElement('bilingual-text', { textZh: '中心广场', textEn: 'Central Plaza', bold: true });
      var mt = SignRender.elementMetrics(big, 192, measure);
      var top = mt.pad.t + mt.zhBase - mt.zhAscent;
      var bottom = mt.pad.t + mt.enBase + measure.descent(big.props.textEn, SignCore.FONT_EN, mt.weight, mt.enSize);
      assert(Math.abs(top - (192 - bottom)) < 0.001, '图2文字上下留白相等');
      assert(top < mt.pad.t + SignRender.INK_TOP_LEADING * mt.pad.size - 4, '整组文字已向上移');
      var small = SignRender.elementMetrics(SignState.createElement('small-bilingual-text', big.props), 192, measure);
      assert(Math.abs(small.zhBase - small.zhAscent - SignRender.INK_TOP_LEADING * small.pad.size) < 0.001, '小号保持标签顶齐');
    });

    test('MiSans实际字体导出：内嵌真实TTF，192px高度PNG可光栅化', function () {
      var S = SignState;
      var sign = S.createSign();
      sign = S.setSignWidthUnits(sign, 3);
      sign = S.addElement(sign, sign.rows[0].id, S.createElement('bilingual-text', { textZh: '人民广场', textEn: 'Station', bold: true }));
      sign = S.addElement(sign, sign.rows[0].id, S.createElement('exit', { code: 'C' }));
      return SignExporters.ensureFontData(sign).then(function (embed) {
        assert(embed['MiSans-Regular.ttf'] && embed['MiSans-Bold.ttf'] && embed['Frutiger-Regular.ttf'], '导出内嵌当前使用的真实字体');
        var str = SignExporters.buildExportSVGString(sign, measure, embed);
        assert(str.indexOf("font-family:'MiSans'") !== -1 && str.indexOf('data:font/ttf;base64,') !== -1, 'SVG内嵌MiSans');
        assert(str.indexOf('Source Han Sans') === -1 && str.indexOf('Helvetica') === -1, 'SVG不引用旧默认字体');
        var url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml' }));
        return new Promise(function (resolve, reject) {
          var img = new Image();
          img.onload = function () {
            try {
              assertEqual(img.naturalWidth, 768); assertEqual(img.naturalHeight, 192);
              var canvas = document.createElement('canvas'); canvas.width = 768; canvas.height = 192;
              canvas.getContext('2d').drawImage(img, 0, 0);
              canvas.toBlob(function (blob) {
                URL.revokeObjectURL(url);
                if (!blob || blob.size < 1000) reject(new Error('MiSans PNG无内容'));
                else resolve();
              }, 'image/png');
            } catch (err) { URL.revokeObjectURL(url); reject(err); }
          };
          img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('MiSans SVG光栅化失败')); };
          img.src = url;
        });
      });
    });

    // ─── 运行器 ────────────────────────────────────────

    function run() {
      var results = document.getElementById('results');
      var passed = 0, failed = 0;
      var chain = Promise.resolve();
      tests.forEach(function (t) {
        var item = document.createElement('div');
        item.className = 'test-case';
        item.innerHTML = '<h3></h3>';
        item.querySelector('h3').textContent = t.name;
        var ran = false;
        chain = chain.then(function () {
          return Promise.resolve().then(t.fn).then(function () {
            ran = true; passed++;
            item.classList.add('passed');
            item.querySelector('h3').innerHTML = '✔ ' + item.querySelector('h3').textContent;
          }, function (err) {
            ran = true; failed++;
            item.classList.add('failed');
            var pre = document.createElement('div');
            pre.className = 'error';
            pre.textContent = (err && err.message) || String(err);
            item.appendChild(pre);
          });
        });
        results.appendChild(item);
      });
      chain.then(function () {
        var s = document.getElementById('summary');
        s.innerHTML = '结果：<b class="' + (failed ? 'fail' : 'pass') + '">' +
          passed + ' 通过 / ' + failed + ' 失败</b>';
        document.title = failed ? '✖ 测试失败' : '✔ 全部通过';
      });
    }
    Promise.all(SignCore.FONT_LOAD_SPECS.map(function (spec) {
      return document.fonts.load(spec.css, '人民广场 Station 0123456789').catch(function (err) {
        throw new Error(spec.css + '：' + err.message);
      });
    })).then(run, function (err) {
      document.title = '✖ 字体加载失败';
      document.getElementById('summary').textContent = String(err);
    });
  </script>
