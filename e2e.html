<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>E2E 交互测试</title>
  <style>
    body { font-family: Consolas, monospace; background: #111; color: #ddd; padding: 12px; font-size: 13px; }
    h1 { font-size: 15px; color: #fff; }
    .case { margin: 2px 0; }
    .pass { color: #4ade80; } .fail { color: #f87171; }
    .detail { white-space: pre-wrap; margin-left: 2em; color: #fca5a5; }
    #summary { font-size: 16px; font-weight: bold; margin: 8px 0; }
    iframe { display: block; width: 1280px; height: 860px; border: 2px solid #444; margin-top: 10px; background: #fff; }
    button { font-size: 14px; padding: 6px 14px; }
  </style>
</head>
<body>
  <h1>导向标识生成器 — E2E 交互测试（iframe 驱动）</h1>
  <div id="summary">运行中…</div>
  <div id="results"></div>
  <iframe id="app-frame" src="index.html"></iframe>

  <script>
    // ─── 微型测试框架 ─────────────────────────────────────
    var results = [];
    var frame = document.getElementById('app-frame');

    function ok(name, cond, detail) {
      results.push({ name: name, pass: !!cond, detail: detail ? String(detail) : '' });
      var div = document.createElement('div');
      div.className = 'case ' + (cond ? 'pass' : 'fail');
      div.textContent = (cond ? '✔ ' : '✖ ') + name + (cond ? '' : '  —  ' + detail);
      document.getElementById('results').appendChild(div);
    }

    function $(sel) { return frame.contentDocument.querySelector(sel); }
    function $$(sel) { return Array.prototype.slice.call(frame.contentDocument.querySelectorAll(sel)); }
    function W() { return frame.contentWindow; }

    function rectOf(el) {
      var r = el.getBoundingClientRect();
      var fr = frame.getBoundingClientRect();
      return { x: r.left, y: r.top, w: r.width, h: r.height }; // iframe 内坐标即 client 坐标系
    }

    function mouse(type, target, x, y) {
      target.dispatchEvent(new MouseEvent(type, {
        clientX: x, clientY: y, bubbles: true, cancelable: true, button: 0,
      }));
    }

    /** 合成指针事件（interact.js 拖拽层监听 pointerdown/pointermove/pointerup） */
    function pointer(type, target, x, y, opts) {
      target.dispatchEvent(new PointerEvent(type, Object.assign({
        clientX: x, clientY: y, bubbles: true, cancelable: true, button: 0,
        pointerId: 1, pointerType: 'mouse', isPrimary: true,
      }, opts || {})));
    }

    /** 合成指针拖拽（应用监听 pointerdown 委托 + document pointermove/up） */
    function drag(fromEl, toPoint, opts) {
      var options = opts || {};
      var r = fromEl.getBoundingClientRect();
      var sx = options.fromX !== undefined ? options.fromX : r.left + r.width / 2;
      var sy = options.fromY !== undefined ? options.fromY : r.top + r.height / 2;
      pointer('pointerdown', fromEl, sx, sy);
      // 激活阈值 5px
      pointer('pointermove', W().document, sx + 8, sy + 4);
      var steps = 6;
      for (var i = 1; i <= steps; i++) {
        var x = sx + (toPoint.x - sx) * i / steps;
        var y = sy + (toPoint.y - sy) * i / steps;
        pointer('pointermove', W().document, x, y);
      }
      pointer('pointermove', W().document, toPoint.x, toPoint.y);
      pointer('pointerup', W().document, toPoint.x, toPoint.y);
    }

    /**
     * 对最顶层（最后 appended）的模态执行动作。
     * 模态回调（删除/保存等）在 Promise 微任务中执行，
     * 因此返回 Promise 并延迟一拍，调用方必须 await。
     */
    function modalAct(act) {
      var masks = $$('.modal-mask');
      var mask = masks[masks.length - 1];
      mask.querySelector('[data-act="' + act + '"]').click();
      return new Promise(function (r) { setTimeout(r, 30); });
    }

    function waitFor(condFn, timeout) {
      var deadline = Date.now() + (timeout || 1500);
      return new Promise(function (resolve) {
        function tick() {
          try { if (condFn()) { resolve(true); return; } } catch (e) { /* 继续等 */ }
          if (Date.now() > deadline) { resolve(false); return; }
          setTimeout(tick, 40);
        }
        tick();
      });
    }

    function runWhenReady(fn) {
      return new Promise(function (resolve, reject) {
        window.__checkCount = 0;
        window.__lastCheckState = 'init';
        function check() {
          window.__checkCount++;
          var w = W();
          try {
            if (!w.document) { window.__lastCheckState = 'no-doc'; setTimeout(check, 100); return; }
            var blocked = w.document.querySelector('.modal-mask [data-act="ok"]');
            if (blocked && (!w.App || !w.App.measure)) {
              window.__lastCheckState = 'blocked-modal';
              blocked.click();
              setTimeout(check, 100);
              return;
            }
            var ready = w.App && w.App.measure && w.App.state &&
              w.document.getElementById('loading-overlay') &&
              w.document.getElementById('loading-overlay').hidden;
            window.__lastCheckState = 'app=' + !!w.App + ' measure=' + !!w.App.measure +
              ' state=' + !!w.App.state + ' hidden=' + (w.document.getElementById('loading-overlay') || {}).hidden;
            if (ready) {
              setTimeout(function () {
                try { resolve(fn()); } catch (e) { reject(e); }
              }, 150);
            } else {
              setTimeout(check, 100);
            }
          } catch (e) {
            window.__lastCheckState = 'ERR: ' + e.message;
          }
        }
        check();
      });
    }

    // ─── 场景 ─────────────────────────────────────────────

    function setupScenario() {
      var w = W(), S = w.SignState;
      // 干净状态：一行
      w.App.update(function () {
        var s = S.createSign();
        var r1 = s.rows[0].id;
        s = S.addElement(s, r1, S.createElement('arrow', { direction: 'left' }));
        s = S.addElement(s, r1, S.createElement('bilingual-text', { textZh: '甲站', textEn: 'Station A' }));
        s = S.addElement(s, r1, S.createElement('space', { widthRatio: 0.5 }));
        s = S.addRow(s);
        s = S.addElement(s, s.rows[1].id, S.createElement('exit', { code: '3' }));
        localStorage.removeItem('sign-presets');
        return s;
      });
      // 编辑器偏好回到默认基线（存储与内存同步），保证场景间确定性
      w.App.prefs = { autoLineColor: true, paletteCity: 'shanghai' };
      localStorage.removeItem('sign-prefs');
      w.App.select(null);
      w.App.previewPreset(null);
      w.App.renderAll();
    }

    function s01_selectAndPanel() {
      var w = W();
      var g = $('#sign-svg g.element'); // 第一个元素 arrow
      var r = g.getBoundingClientRect();
      mouse('click', g.querySelector('.hitbox'), r.left + 10, r.top + 10);
      var title = $('#right-panel-title').textContent;
      ok('S01 点击元素 → 右栏切换元素属性', title === '元素属性', 'title=' + title);
      ok('S01 选中类出现在元素上', g.classList.contains('selected') || $('#sign-svg g.element.selected') !== null);
      // 取消选中：点击空白（sign-bg）
      mouse('click', $('#sign-svg .sign-bg'), 30, 30);
      ok('S01 点击空白 → 取消选中', w.App.selection.elementId === null && $('#right-panel-title').textContent === '标识牌设置');
    }

    function s02_elementDragReorder() {
      var w = W();
      var row0 = w.App.state.rows[0];
      var before = row0.elements.map(function (e) { return e.id; });
      var gs = $$('g.element[data-row-id="' + row0.id + '"]');
      var last = gs[gs.length - 1]; // space
      var first = gs[0];
      var fr = first.getBoundingClientRect();
      drag(last, { x: fr.left + 4, y: fr.top + fr.height / 2 });
      var after = w.App.state.rows[0].elements.map(function (e) { return e.id; });
      ok('S02 行内拖拽排序：space 移到队首', after[0] === before[2] && after[1] === before[0], 'after=' + after.join(',').slice(0, 40));
      // 拖回原位（队尾）
      var g2 = $$('g.element[data-row-id="' + row0.id + '"]')[0];
      var lastEl = $$('g.element[data-row-id="' + row0.id + '"]');
      var tail = lastEl[lastEl.length - 1].getBoundingClientRect();
      drag(g2, { x: tail.right - 4, y: tail.top + tail.height / 2 });
      var restored = w.App.state.rows[0].elements.map(function (e) { return e.id; });
      ok('S02 拖回队尾恢复原序', restored.join() === before.join());
    }

    function s03_crossRowDrag() {
      var w = W();
      var row0 = w.App.state.rows[0];
      var spaceId = row0.elements[2].id;
      var g = $('g.element[data-element-id="' + spaceId + '"]');
      var row2g = $$('g.element[data-row-id="' + w.App.state.rows[1].id + '"]');
      var target = row2g[row2g.length - 1].getBoundingClientRect();
      drag(g, { x: target.right - 4, y: target.top + target.height / 2 });
      var moved = w.SignState.findElement(w.App.state, spaceId);
      ok('S03 跨行拖动：space 移到第 2 行', moved.rowId === w.App.state.rows[1].id, 'rowId=' + moved.rowId);
      ok('S03 第 1 行剩 2 个元素', w.App.state.rows[0].elements.length === 2);
    }

    function s04_rowHandleDrag() {
      var w = W();
      var firstRowId = w.App.state.rows[0].id;
      var handle = $('.row-band[data-row-index="0"] .row-handle');
      var band1 = $('.row-band[data-row-index="1"]');
      var b1 = band1.getBoundingClientRect();
      drag(handle, { x: b1.left + 30, y: b1.top + b1.height * 0.75 }, { fromX: handle.getBoundingClientRect().left + 10 });
      ok('S04 行手柄拖拽：第 1 行移到第 2 行', w.App.state.rows[1].id === firstRowId);
      // 拖回去
      var handle2 = $('.row-band[data-row-index="1"] .row-handle');
      var band0 = $('.row-band[data-row-index="0"]');
      var b0 = band0.getBoundingClientRect();
      drag(handle2, { x: b0.left + 30, y: b0.top + 4 }, { fromX: handle2.getBoundingClientRect().left + 10 });
      ok('S04 拖回恢复行序', w.App.state.rows[0].id === firstRowId);
    }

    async function s05_deleteRowWithConfirm() {
      var w = W();
      var rowsBefore = w.App.state.rows.length;
      var del = $('.row-band[data-row-index="1"] .row-del');
      del.click();
      var modal = $('.modal-mask');
      ok('S05 删除行弹出确认对话框', !!modal);
      // 取消 → 不删
      await modalAct('cancel');
      ok('S05 取消后行未删除', w.App.state.rows.length === rowsBefore);
      // 再删 → 确定
      $('.row-band[data-row-index="1"] .row-del').click();
      await modalAct('ok');
      ok('S05 确认后行被删除', w.App.state.rows.length === rowsBefore - 1);
      // 最后一行不可删
      var lastDel = $('.row-band .row-del');
      ok('S05 仅剩一行时删除按钮禁用', lastDel.disabled === true);
    }

    async function s06_savePresetFlow() {
      var w = W();
      $('.row-band .row-actions button').click(); // 存为预设
      var input = $('.modal-input');
      ok('S06 弹出命名对话框', !!input);
      input.value = '测试行';
      await modalAct('ok');
      var presets = w.SignPresets.list();
      ok('S06 预设已保存', presets.length === 1 && presets[0].name === '测试行');
      ok('S06 左栏出现预设卡片', $$('.preset-card').length === 1 && $$('.preset-card .preset-thumb svg').length === 1);
      // 删除预设（卡片 ✕）
      $('.preset-delete').click();
      await modalAct('ok');
      ok('S06 预设可删除', w.SignPresets.list().length === 0);
    }

    function s07_presetPreviewAndDrop() {
      var w = W(), S = w.SignState, P = w.SignPresets;
      // 重新存一个预设
      P.save('落牌预设', [S.createElement('arrow', { direction: 'up' }), S.createElement('space', { widthRatio: 0.3 })]);
      w.App.renderAll();
      // 点击卡片 → 预览面板
      $$('.preset-card')[0].click();
      ok('S07 点击预设 → 右栏预览', $('#right-panel-title').textContent === '预设预览');
      w.App.previewPreset(null);

      // HTML5 拖放到空行（构造 DataTransfer 派发 dragover/drop）
      var dataTransfer = new w.DataTransfer();
      dataTransfer.setData(w.SignInteract.MIME_PRESET, JSON.stringify({ kind: 'preset', id: P.list()[0].id }));
      var wrap = $('#canvas-wrap');
      // 目标：添加一个空行并放入
      w.App.update(S.addRow);
      var emptyRowIndex = w.App.state.rows.length - 1;
      var band = $('.row-band[data-row-index="' + emptyRowIndex + '"]');
      var br = band.getBoundingClientRect();
      var ev1 = new w.DragEvent('dragover', { dataTransfer: dataTransfer, clientX: br.left + 100, clientY: br.top + br.height / 2, bubbles: true, cancelable: true });
      wrap.dispatchEvent(ev1);
      ok('S07 空行显示可放置高亮', band.classList.contains('drop-ok'));
      var ev2 = new w.DragEvent('drop', { dataTransfer: dataTransfer, clientX: br.left + 100, clientY: br.top + br.height / 2, bubbles: true, cancelable: true });
      wrap.dispatchEvent(ev2);
      var target = w.App.state.rows[emptyRowIndex];
      ok('S07 预设落入空行（元素替换）', target.elements.length === 2 && target.elements[0].props.direction === 'up',
        'len=' + target.elements.length);

      // 有元素的行 → drop-invalid 且不替换
      var dataTransfer2 = new w.DataTransfer();
      dataTransfer2.setData(w.SignInteract.MIME_PRESET, JSON.stringify({ kind: 'preset', id: P.list()[0].id }));
      var band0 = $('.row-band[data-row-index="0"]');
      var b0 = band0.getBoundingClientRect();
      wrap.dispatchEvent(new w.DragEvent('dragover', { dataTransfer: dataTransfer2, clientX: b0.left + 100, clientY: b0.top + b0.height / 2, bubbles: true, cancelable: true }));
      ok('S07 非空行显示禁止放置', band0.classList.contains('drop-invalid'));
      var row0Before = w.App.state.rows[0].elements.map(function (e) { return e.id; });
      wrap.dispatchEvent(new w.DragEvent('drop', { dataTransfer: dataTransfer2, clientX: b0.left + 100, clientY: b0.top + b0.height / 2, bubbles: true, cancelable: true }));
      ok('S07 非空行释放无效', w.App.state.rows[0].elements.map(function (e) { return e.id; }).join() === row0Before.join());
      localStorage.removeItem('sign-presets');
    }

    function s08_paletteDropNewElement() {
      var w = W();
      var dataTransfer = new w.DataTransfer();
      dataTransfer.setData(w.SignInteract.MIME_NEW, JSON.stringify({ kind: 'new', type: 'big-number' }));
      var wrap = $('#canvas-wrap');
      var band = $('.row-band[data-row-index="0"]');
      var br = band.getBoundingClientRect();
      wrap.dispatchEvent(new w.DragEvent('dragover', { dataTransfer: dataTransfer, clientX: br.left + 400, clientY: br.top + br.height / 2, bubbles: true, cancelable: true }));
      wrap.dispatchEvent(new w.DragEvent('drop', { dataTransfer: dataTransfer, clientX: br.left + 400, clientY: br.top + br.height / 2, bubbles: true, cancelable: true }));
      var row0 = w.App.state.rows[0];
      ok('S08 拖放新元素到指定行', row0.elements[row0.elements.length - 1].type === 'big-number');
      // 卡片点击 → 加到末行
      var lastRowBefore = w.App.state.rows[w.App.state.rows.length - 1].elements.length;
      $$('.palette-card').filter(function (c) { return c.textContent.indexOf('大文本') !== -1; })[0].click();
      ok('S08 点击卡片添加到末行', w.App.state.rows[w.App.state.rows.length - 1].elements.length === lastRowBefore + 1);
    }

    function s09_settingsAndAspectLock() {
      var w = W(), S = w.SignState;
      // 固定宽度改窄
      w.App.update(function (st) { return S.updateSignSettings(st, { width: 1600 }); });
      ok('S09 固定宽度生效', w.App.layout.width === 1600);
      // 锁定宽高比后改行高 → 宽度等比
      w.App.update(function (st) { return S.updateSignSettings(st, { aspectLocked: true, rowHeight: 128 }); });
      ok('S09 锁定比例：行高 256→128 宽度 1600→800', w.App.state.width === 800 && w.App.state.rowHeight === 128,
        'w=' + w.App.state.width + ' h=' + w.App.state.rowHeight);
      // 动态宽度
      w.App.update(function (st) { return S.updateSignSettings(st, { widthMode: 'dynamic', aspectLocked: false, rowHeight: 200 }); });
      var dynamicW = w.App.layout.width;
      ok('S09 动态宽度 = 最宽行', dynamicW === Math.max.apply(null, w.App.state.rows.map(function (r) {
        return w.SignRender.computeRowWidth(r, 200, w.App.measure);
      }).concat([200])), 'w=' + dynamicW);
      w.App.update(function (st) { return S.updateSignSettings(st, { widthMode: 'fixed', width: 2048 }); });
    }

    function s10_paddingEdit() {
      var w = W(), S = w.SignState;
      var el = w.App.state.rows[0].elements[0];
      var before = w.SignRender.computeElementWidth(el, w.App.state.rowHeight, w.App.measure);
      w.App.update(function (st) { return S.updateElementProps(st, el.id, { padding: { right: 0.4 } }); });
      var after = w.SignRender.computeElementWidth(w.SignState.findElement(w.App.state, el.id).element, w.App.state.rowHeight, w.App.measure);
      ok('S10 内边距修改 → 宽度增加', after > before, before + '→' + after);
    }

    async function s11_clearSign() {
      var w = W();
      // 触发 UI 按钮
      var btns = $$('#right-panel-body .btn');
      var clearBtn = btns.filter(function (b) { return b.textContent.indexOf('清空标识牌') !== -1; })[0];
      w.App.select(null);
      clearBtn = $$('#right-panel-body .btn').filter(function (b) { return b.textContent.indexOf('清空标识牌') !== -1; })[0];
      clearBtn.click();
      var modal = $('.modal-mask');
      ok('S11 清空需确认', !!modal);
      await modalAct('ok');
      ok('S11 清空后恢复一行空白', w.App.state.rows.length === 1 && w.App.state.rows[0].elements.length === 0);
      ok('S11 清空保留设置（宽度 2048）', w.App.state.width === 2048);
    }

    function s12_panelsCollapse() {
      var w = W();
      $('#left-collapse').click();
      ok('S12 左栏收起', $('#left-panel').classList.contains('collapsed') && $('#left-expander').hidden === false);
      $('#left-expander').click();
      ok('S12 左栏展开', !$('#left-panel').classList.contains('collapsed') && $('#left-expander').hidden === true);
      $('#right-collapse').click();
      ok('S12 右栏收起', $('#right-panel').classList.contains('collapsed'));
      $('#right-expander').click();
      ok('S12 右栏展开', !$('#right-panel').classList.contains('collapsed'));
    }

    function s13_exporters() {
      var w = W();
      var s = w.App.state;
      var str = w.SignExporters.buildExportSVGString(s, w.App.measure, {});
      ok('S13 导出 SVG 是合法 XML', str.indexOf('<?xml') === 0 && new w.DOMParser().parseFromString(str, 'image/svg+xml').querySelector('parsererror') === null);
      // 字体收集
      w.App.update(function (st) {
        var S = w.SignState;
        st = S.addElement(st, st.rows[0].id, S.createElement('bilingual-text', { textZh: '站', textEn: 'St' }));
        return st;
      });
      var used = w.SignExporters.collectUsedFonts(w.App.state);
      ok('S13 字体按需收集（中文+英文+数字）', used.zh400 && used.en400, JSON.stringify(used));
    }

    function s14_jsonRoundtrip() {
      var w = W();
      var json = w.SignState.serializeSign(w.App.state);
      var back = w.SignState.deserializeSign(json);
      ok('S14 JSON 往返一致', JSON.stringify(back) === JSON.stringify(w.App.state));
      var bad = false;
      try { w.SignState.deserializeSign('{{{'); } catch (e) { bad = true; }
      ok('S14 非法 JSON 抛错', bad);
    }

    async function s15_instanceGuard() {
      var w = W();
      // 伪造其他活跃实例
      w.localStorage.setItem('sign-instance', JSON.stringify({ id: 'other', ts: Date.now() }));
      w.SignStorage.setupInstanceGuard();
      var masks = $$('.modal-mask');
      var modal = masks[masks.length - 1];
      ok('S15 检测到其他实例弹出警告', !!modal && modal.textContent.indexOf('已有运行中的编辑器实例') !== -1);
      await modalAct('ok');
      var inst = JSON.parse(w.localStorage.getItem('sign-instance'));
      ok('S15 确认后接管实例标记', inst.id !== 'other');
    }

    async function s16_autosavePresent() {
      var w = W();
      // 自动保存防抖 500ms：等待落盘而非立即断言，消除快速机器上的竞态
      var saved = await waitFor(function () { return !!w.localStorage.getItem('sign-autosave'); });
      ok('S16 自动保存存档存在', saved);
    }

    // ─── 回归：属性面板编辑与对齐渲染 ─────────────────────

    /** 面板里模拟键入：设值并派发 input + change 事件（数字输入框监听 change） */
    function typeInto(input, value) {
      input.focus();
      input.value = value;
      input.dispatchEvent(new (W().Event)('input', { bubbles: true }));
      input.dispatchEvent(new (W().Event)('change', { bubbles: true }));
    }

    function s17_numberLineEditKeepsValue() {
      var w = W(), S = w.SignState;
      var el = S.createElement('number-line', {
        lines: [{ number: '1', color: '#E3002B' }, { number: '2', color: '#82BF25' }],
      });
      w.App.update(function (st) { return S.addElement(st, st.rows[0].id, el); });
      w.App.select(el.id);
      var inputs = $$('#right-panel-body .lines-editor .le-number');
      ok('S17 两条线路各有编号输入框', inputs.length === 2, 'n=' + inputs.length);
      typeInto(inputs[0], '3');
      var st = w.SignState.findElement(w.App.state, el.id).element;
      ok('S17 输入 3 → 状态更新', st.props.lines[0].number === '3',
        'lines=' + st.props.lines.map(function (l) { return l.number; }).join(','));
      // 焦点切到另一处继续输入 → 之前的修改不得回跳到默认值
      typeInto(inputs[1], '5');
      st = w.SignState.findElement(w.App.state, el.id).element;
      ok('S17 他处输入后原修改保持（状态）',

    function s19_bilingualAlignInsideBox() {
      var w = W(), S = w.SignState;

      var elId = sel.getAttribute('data-element-id');
      var el = S.findElement(w.App.state, elId).element;

      function textEdges() {
        sel = $('#sign-svg g.element.selected'); // 重渲染后节点重建，需重新查询
        var box = sel.querySelector('.hitbox').getBoundingClientRect();
        var minLeft = Infinity, maxRight = -Infinity;
        $$('g.element.selected > text').forEach(function (t) {
          var r = t.getBoundingClientRect();
          minLeft = Math.min(minLeft, r.left);
          maxRight = Math.max(maxRight, r.right);
        });
        return { box: box, minLeft: minLeft, maxRight: maxRight };
      }

      var e = textEdges();
      ok('S19 右对齐文本不超出虚线框', e.maxRight <= e.box.right + 1,
        '右缘超出 ' + (e.maxRight - e.box.right) + 'px');
      var padR = el.props.padding.right * w.App.state.rowHeight;
      ok('S19 右对齐文本贴内容右缘', e.maxRight >= e.box.right - padR - 2,
        '距内容右缘 ' + (e.box.right - padR - e.maxRight) + 'px');

      w.App.update(function (st) { return S.updateElementProps(st, elId, { align: 'center' }); });
      e = textEdges();
      ok('S19 居中不越界（右）', e.maxRight <= e.box.right + 1, '超出 ' + (e.maxRight - e.box.right) + 'px');
      ok('S19 居中不越界（左）', e.minLeft >= e.box.left - 1, '左缘差 ' + (e.box.left - e.minLeft) + 'px');
      w.App.select(null);
    }

    // S34：hex 输入框不打断输入（回归：3 位缩写 '#737' 提交曾把输入框改写为

    function s34_hexInputNoClobber() {
      var w = W(), S = w.SignState;
      w.App.update(function (st) {
        st = S.updateSignSettings(S.clearSign(st), { width: 900 });
        return S.addElement(st, st.rows[0].id, S.createElement('exit', { code: '1' }));

      var hex = $('#right-panel-body .hex-input');
      function color() { return w.App.state.rows[0].elements[0].props.color; }
      function type(input, text) {
        input.focus();
        var start = input.selectionStart == null ? input.value.length : input.selectionStart;
        input.value = input.value.slice(0, start) + text + input.value.slice(input.selectionEnd == null ? start : input.selectionEnd);
        input.selectionStart = input.selectionEnd = start + text.length;
        input.dispatchEvent(new w.Event('input', { bubbles: true }));
      }

      // 无 # 前缀的 6 位写法：提交规整值、字段保持用户原文
      hex.focus();

      type(hex, 'a1b2c3');

      // 失焦后外部同步恢复：移走焦点再触发一次渲染，字段应规整为已提交值
      hex.blur();

      hex2.blur();
      w.App.select(null);
    }

    }

    // S37：pagehide 立即刷盘自动存档（移动端切后台不触发 beforeunload）
    async function s37_pagehideFlush() {
      var w = W();
      w.App.update(function (st) {
        return w.SignState.updateSignSettings(st, { frameWidth: 7 });
      });
      w.localStorage.removeItem('sign-autosave');
      w.dispatchEvent(new w.Event('pagehide')); // 防抖 500ms 未到即模拟离页
      var raw = w.localStorage.getItem('sign-autosave');
      var data = null;
      try { data = raw ? JSON.parse(raw) : null; } catch (e) { /* 非法存档按失败 */ }
      ok('S37 pagehide 立即刷盘自动存档', !!data && data.sign && data.sign.frameWidth === 7,
        raw ? 'frameWidth=' + (data && data.sign && data.sign.frameWidth) : 'null');
      w.App.update(function (st) {
        return w.SignState.updateSignSettings(st, { frameWidth: 0 });
      });
    }

    // S38：移动端壳层（375px 视口）——palette 分支、自动选中、底部带折叠、pinch/平移/双击复位
    async function s38_mobileShell() {
      var w = W();
      var frameEl = frame;
      frameEl.style.width = '375px';
      // 真实浏览器视口变化必然同步派发 resize；IAB 里 iframe 样式变更的
      // 布局/事件可能被节流推迟，这里补发 resize 直达应用的断点检查
      W().dispatchEvent(new (W().Event)('resize'));
      var switched = await waitFor(function () {
        return w.App.isMobileView() && $$('.palette-chip').length === 7;
      }, 6000);
      ok('S38 窄视口进入移动布局（6 分类 + 预设 chip）', switched,
        'mobile=' + w.App.isMobileView() + ' chips=' + $$('.palette-chip').length);

      // chip 切换分类重渲染卡片条
      $$('.palette-chip')[3].click(); // 文本（1 张卡片）
      var textCards = await waitFor(function () { return $$('.palette-strip .palette-card').length === 1; });
      ok('S38 chip 切换分类重渲染卡片条', textCards &&
        $$('.palette-chip')[3].classList.contains('active'));
      $$('.palette-chip')[0].click(); // 回方向指示

      // 行控件外置：行带内不再有手柄/按钮（防与元素叠加），改由下方行条承接
      ok('S38 行带内无手柄与按钮（不与元素叠加）',
        $$('.row-band .row-handle').length === 0 && $$('.row-band .row-actions').length === 0,
        'handles=' + $$('.row-band .row-handle').length + ' actions=' + $$('.row-band .row-actions').length);
      var S38s = w.SignState;
      w.App.update(S38s.addRow);
      var stripChips = $$('#row-strip .row-strip-chip');
      ok('S38 行条按行数渲染', stripChips.length === w.App.state.rows.length,
        'chips=' + stripChips.length + ' rows=' + w.App.state.rows.length);
      var firstRowId = w.App.state.rows[0].id;
      stripChips[0].querySelectorAll('.rs-btn')[1].click(); // ▼ 下移
      ok('S38 行条 ▼ 下移一行', w.App.state.rows[1].id === firstRowId,
        'rows=' + w.App.state.rows.map(function (r) { return r.id; }).join(','));
      $$('#row-strip .row-strip-chip')[1].querySelectorAll('.rs-btn')[0].click(); // ▲ 上移
      ok('S38 行条 ▲ 上移恢复', w.App.state.rows[0].id === firstRowId);

      // 移动端禁用卡片原生拖拽（回归：触屏长按唤起原生拖拽 → 卡片置灰、页面卡死）
      var mCard = $$('.palette-strip .palette-card')[0];
      ok('S38 移动端卡片 draggable=false', mCard.getAttribute('draggable') === 'false',
        'draggable=' + mCard.getAttribute('draggable'));
      var dEv = new w.DragEvent('dragstart', { bubbles: true, cancelable: true, dataTransfer: new w.DataTransfer() });
      mCard.dispatchEvent(dEv);
      ok('S38 移动端 dragstart 被阻止且不置灰',
        dEv.defaultPrevented === true && !mCard.classList.contains('dragging'),
        'prevented=' + dEv.defaultPrevented + ' dragging=' + mCard.classList.contains('dragging'));

      // 底部带折叠 → 点击添加 → 自动选中新元素并展开
      $('#right-collapse').click();
      ok('S38 底部属性带可折叠', $('#right-panel').classList.contains('band-collapsed'));
      var rowsBefore = w.App.state.rows[w.App.state.rows.length - 1].elements.length;
      $$('.palette-strip .palette-card')[0].click();
      var selected = await waitFor(function () { return w.App.selection.elementId !== null; });
      var rowAfter = w.App.state.rows[w.App.state.rows.length - 1];
      ok('S38 移动端点击卡片 → 添加并自动选中',
        selected && rowAfter.elements.length === rowsBefore + 1 &&
        rowAfter.elements[rowAfter.elements.length - 1].id === w.App.selection.elementId);
      ok('S38 选中元素 → 属性带自动展开',
        !$('#right-panel').classList.contains('band-collapsed') &&
        $('#right-panel-title').textContent === '元素属性');

      // 触屏手势（合成 pointerType=touch）
      var cs = w.document.getElementById('canvas-scroll');
      var csr = cs.getBoundingClientRect();
      function touch(type, x, y, id) {
        pointer(type, cs, x, y, { pointerId: id, pointerType: 'touch', isPrimary: id === 1 });
      }
      // pinch：两指落下 → 分开 → 抬起
      var cx = csr.left + csr.width / 2, cy = csr.top + csr.height / 2;
      touch('pointerdown', cx - 40, cy, 1);
      touch('pointerdown', cx + 40, cy, 2);
      var svgW = parseFloat($('#sign-svg').style.width);
      touch('pointermove', cx - 90, cy, 1);
      touch('pointermove', cx + 90, cy, 2);
      var zoomed = parseFloat($('#sign-svg').style.width);
      ok('S38 pinch 两指分开 → 画布放大（无拖拽幽灵残留）',
        zoomed > svgW * 1.9 && !$('.drag-ghost'), svgW + '→' + zoomed);
      ok('S38 缩放徽标显示当前倍率', $('#zoom-badge').textContent !== '100%',
        $('#zoom-badge').textContent);
      touch('pointerup', cx - 90, cy, 1);
      touch('pointerup', cx + 90, cy, 2);

      // 单指平移：空白处（上内边距）拖动 → 滚动跟随
      var sl0 = cs.scrollLeft;
      touch('pointerdown', csr.left + 300, csr.top + 6, 1);
      touch('pointermove', csr.left + 220, csr.top + 6, 1);
      var sl1 = cs.scrollLeft;
      touch('pointerup', csr.left + 220, csr.top + 6, 1);
      ok('S38 单指空白拖动 → 画布平移', sl1 > sl0, sl0 + '→' + sl1);

      // 双击复位：空白处两次轻点（合成事件背靠背派发，避免环境节流拉大间隔）
      touch('pointerdown', csr.left + 6, csr.top + 6, 1);
      touch('pointerup', csr.left + 6, csr.top + 6, 1);
      touch('pointerdown', csr.left + 6, csr.top + 6, 1);
      touch('pointerup', csr.left + 6, csr.top + 6, 1);
      ok('S38 双击复位 100%', Math.abs(w.App.canvasZoom - 1) < 0.01 &&
        $('#zoom-badge').textContent === '100%', 'zoom=' + w.App.canvasZoom);

      w.App.select(null);

      // 还原桌面视口
      frameEl.style.width = '1280px';
      W().dispatchEvent(new (W().Event)('resize'));
      var restored = await waitFor(function () {
        return !w.App.isMobileView() && $$('.palette-category').length === 7;
      }, 6000);
      ok('S38 回宽视口恢复桌面 palette 且无移动态残留', restored &&
        !$('#right-panel').classList.contains('band-collapsed') &&
        w.getComputedStyle($('#zoom-badge')).display === 'none');
      ok('S38 回桌面恢复行带控件、清空行条、卡片恢复可拖',
        $$('.row-band .row-handle').length > 0 &&
        $$('#row-strip .row-strip-chip').length === 0 &&
        $$('.palette-card')[0].getAttribute('draggable') === 'true',
        'handles=' + $$('.row-band .row-handle').length +
        ' stripChips=' + $$('#row-strip .row-strip-chip').length +
        ' draggable=' + $$('.palette-card')[0].getAttribute('draggable'));
    }

    // S39：移动端高牌面不挤飞底部属性带（回归：行多 / 动态宽度 → 牌面变高，
    // 底部属性带被挤出视口，元素表单滚到底也够不到删除按钮）
    async function s39_mobileTallSignBand() {
      var w = W();
      var frameEl = frame;
      frameEl.style.width = '375px';
      W().dispatchEvent(new (W().Event)('resize'));
      var switched = await waitFor(function () {
        return w.App.isMobileView() && $$('.palette-chip').length === 7;
      }, 6000);
      ok('S39 窄视口进入移动布局', switched,
        'mobile=' + w.App.isMobileView() + ' chips=' + $$('.palette-chip').length);
      if (!switched) return;

      var S = w.SignState;
      // 选中一个元素（元素表单底部才有删除按钮）
      var elId = null;
      w.App.update(function (st) {
        var el = S.createElement('bilingual-text', {});
        elId = el.id;
        return S.addElement(st, st.rows[0].id, el);
      });
      w.App.select(elId);

      function bandState() {
        var vh = W().innerHeight;
        var rp = rectOf($('#right-panel'));
        return { vh: vh, rpBottom: rp.y + rp.h };
      }
      function delBtnAfterBottomScroll() {
        var body = $('#right-panel-body');
        body.scrollTop = body.scrollHeight; // 属性带内部滚到底
        var btns = $$('#right-panel-body .btn-danger').filter(function (b) {
          return b.textContent.indexOf('删除元素') !== -1;
        });
        if (!btns.length) return null;
        var r = rectOf(btns[0]);
        return r.y + r.h;
      }

      // 触发一：固定宽度下行数多（行高累加）
      while (w.App.state.rows.length < 15) w.App.update(S.addRow);
      var rowsCase = bandState();
      var rowsDel = delBtnAfterBottomScroll();
      var cs = w.document.getElementById('canvas-scroll');
      ok('S39 多行高牌面：底部属性带仍在视口内', rowsCase.rpBottom <= rowsCase.vh + 0.5,
        'bandBottom=' + rowsCase.rpBottom + ' vh=' + rowsCase.vh);
      ok('S39 多行高牌面：删除按钮滚到底后可达', rowsDel !== null && rowsDel <= rowsCase.vh + 0.5,
        'delBottom=' + rowsDel + ' vh=' + rowsCase.vh);
      ok('S39 多行高牌面：画布在滚动容器内溢出（而非撑破布局）',
        cs.scrollHeight > cs.clientHeight + 40,
        'scrollHeight=' + cs.scrollHeight + ' clientHeight=' + cs.clientHeight);

      // 触发二：动态宽度（牌面宽度收窄到内容 → 同样行数下显示高度暴涨）
      w.App.update(function (st) {
        return S.updateSignSettings(st, { widthMode: 'dynamic' });
      });
      var dyn = bandState();
      var dynDel = delBtnAfterBottomScroll();
      ok('S39 动态宽度高牌面：底部属性带仍在视口内', dyn.rpBottom <= dyn.vh + 0.5,
        'bandBottom=' + dyn.rpBottom + ' vh=' + dyn.vh);
      ok('S39 动态宽度高牌面：删除按钮滚到底后可达', dynDel !== null && dynDel <= dyn.vh + 0.5,
        'delBottom=' + dynDel + ' vh=' + dyn.vh);

      w.App.select(null);
      // 还原桌面视口
      frameEl.style.width = '1280px';
      W().dispatchEvent(new (W().Event)('resize'));
      var restored = await waitFor(function () {
        return !w.App.isMobileView() && $$('.palette-category').length === 7;
      }, 6000);
      ok('S39 回宽视口恢复桌面布局', restored, 'mobile=' + w.App.isMobileView());
    }

    // ─── 主流程 ───────────────────────────────────────────

    var frameEl = document.getElementById('app-frame');
    function start() {
      runWhenReady(async function () {
        setupScenario();
        s01_selectAndPanel();
        s02_elementDragReorder();
        s03_crossRowDrag();
        s04_rowHandleDrag();
        await s05_deleteRowWithConfirm();
        await s06_savePresetFlow();
        s07_presetPreviewAndDrop();
        s08_paletteDropNewElement();
        s09_settingsAndAspectLock();
        s10_paddingEdit();
        await s11_clearSign();
        s12_panelsCollapse();
        s13_exporters();
        s14_jsonRoundtrip();
        await s15_instanceGuard();
        await s16_autosavePresent();
        s17_numberLineEditKeepsValue();
        s18_bilingualPanelKeepsEdits();
        s19_bilingualAlignInsideBox();
        s20_widthModeEchoAndPadding();
        s21_elementAlignLanes();
        s22_arrowDiagonals();
        s23_iconElement();
        s24_textLineNameSink();
        s25_paletteCityAndAutoColor();
        s26_contentAlignRight();
        s27_rightLaneDrag();
        s28_centerLaneDrag();
        await s29_deleteKeyAndEmptyRow();
        s30_signFrame();
        s31_miscFixes();
        s32_autoAdjacentPadding();
        s33_dropIndicatorAlignment();
        s34_hexInputNoClobber();
        await s35_exportButtonFeedback();
        s36_canvasZoomFit();
        await s37_pagehideFlush();
        await s38_mobileShell();
        await s39_mobileTallSignBand();
      }).then(function () {
        var passed = results.filter(function (r) { return r.pass; }).length;
        var total = results.length;
        var failed = total - passed;
        var s = document.getElementById('summary');
        s.textContent = '结果：' + passed + ' 通过 / ' + failed + ' 失败';
        s.style.color = failed ? '#f87171' : '#4ade80';
        document.title = failed ? '✖ E2E 失败 (' + failed + ')' : '✔ E2E 全部通过';
        window.__E2E_RESULTS__ = { passed: passed, failed: failed, results: results };
        try { localStorage.setItem('e2e-results', JSON.stringify(window.__E2E_RESULTS__)); } catch (e) {}
      }).catch(function (e) {
        ok('执行异常', false, e.message + '\n' + e.stack);
        document.title = '✖ E2E 异常';
        window.__E2E_RESULTS__ = { error: String(e), results: results };
        try { localStorage.setItem('e2e-results', JSON.stringify(window.__E2E_RESULTS__)); } catch (e2) {}
      });
    }
    frameEl.onload = start;
    if (frameEl.contentDocument && frameEl.contentDocument.readyState === 'complete') start();
  </script>
</body>
