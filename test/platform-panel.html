<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>站台属性面板测试</title>
<style>
  body { font: 14px system-ui; }
  iframe { display: block; width: 1280px; height: 860px; border: 1px solid #bbb; }
  .pass { color: #087338; }
  .fail { color: #bd2222; }
</style>
<h1>站台属性面板测试</h1>
<p id="summary" role="status">运行中…</p>
<ol id="results"></ol>
<iframe id="editor" title="站台标识编辑器"></iframe>
<script>
(async function () {
  const frame = document.getElementById('editor');
  const results = document.getElementById('results');
  const saved = Object.entries(localStorage).filter(([key]) => key.includes('platform-sign'));
  let editor, app, state, project;

  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }
  function element(id) { return editor.getElementById(id); }
  function visible(id) { return element(id)?.getClientRects().length > 0; }
  function change(id, value, event = 'change') {
    const input = element(id);
    input.value = value;
    input.dispatchEvent(new frame.contentWindow.Event(event, { bubbles: true }));
  }
  function mode(value) { editor.querySelector('[data-mode="' + value + '"]').click(); }
  function tab(name) { editor.querySelector('[data-property-tab-button="' + name + '"]').click(); }
  function icon(control, name) { return control.dataset.controlIcon === name && control.title && !control.textContent.trim(); }
  function reset() { app.deselect(); app.update(() => project); tab('edit'); }
  async function test(name, run) {
    const result = document.createElement('li');
    try {
      reset();
      await run();
      result.className = 'pass';
      result.textContent = name;
    } catch (error) {
      result.className = 'fail';
      result.textContent = name + '。' + error.message;
    }
    results.append(result);
  }

  try {
    await new Promise(resolve => { frame.addEventListener('load', resolve, { once: true }); frame.src = '../platform.html'; });
    editor = frame.contentDocument;
    app = frame.contentWindow.App;
    state = frame.contentWindow.PlatformState;
    await app.ready;
    project = state.replaceStations(state.create(), state.parseStations('01|起点站|First Station\n02|中途站|Middle Station|1,市郊线~Suburban Line:#0057B8\n03|终点站|Last Station', 'chongqing'));
    project = state.settings(project, { currentId: project.stations[1].id });

    await test('站台标识使用统一的浏览器标签页标题', function () {
      assert(editor.title === 'CRT标识编辑器 - 站台标识', '站台标识网页标题有误');
    });

    await test('整牌设置将常用线路控件放在首签，项目另有标签，图片导出固定', function () {
      assert(visible('line-number') && visible('line-color-picker') && visible('hanging-length') && !visible('return-to-settings'), '首签应直接显示线路和尺寸');
      tab('appearance');
      assert(visible('line-pattern-enabled') && visible('palette-city') && !visible('line-number'), '外观应包含牌面配色与底纹');
      tab('project');
      assert(visible('import-project') && visible('export-png') && !element('property-scroll').contains(element('export-png')), '项目应可见，图片导出应在滚动区以外');
    });

    await test('三种版式只显示适用的尺寸和行车设置，自定义尺寸可直接输入', function () {
      assert(visible('hanging-length') && !visible('vertical-variant') && !visible('show-station-direction'), '全线吊板显示了不适用的字段');
      assert(element('hanging-length').type === 'range' && element('hanging-height').type === 'range', '吊板长度和高度应使用滑条');
      assert(visible('output-width') && visible('output-height'), '精确尺寸应直接可见');
      change('output-width', '948');
      assert(app.state.sizes.route.width === 948 && element('hanging-length').getAttribute('aria-valuetext').includes('948'), '自定义宽度应保存并回显');
      change('hanging-length', '5', 'input');
      change('hanging-length', '6', 'input');
      change('hanging-length', '6');
      assert(app.state.sizes.route.width === 1536 && element('output-width').value === '1536', '拖动应即时改变牌面和像素值');
      app.undo();
      assert(app.state.sizes.route.width === 948, '一次撤销应恢复拖动前的自定义宽度');
      mode('station');
      assert(visible('hanging-length'), '本站吊板缺少排版尺寸设置');
      tab('edit');
      assert(visible('show-station-direction'), '本站吊板缺少行车提示设置');
      mode('vertical');
      assert(!visible('hanging-length') && visible('vertical-variant') && visible('output-height') && element('output-width').readOnly, '纵向版式应直接显示尺寸且锁定宽度');
      change('vertical-variant', 'double');
      assert(visible('swap-vertical-columns'), '双列缺少交换按钮');
    });

    await test('选中站点后只显示相关属性，返回按钮将焦点移回整牌设置标题', function () {
      element('export-png').scrollIntoView({ block: 'nearest' });
      app.select(project.currentId);
      assert(element('property-heading').textContent === '站点属性', '选中站点后的标题有误');
      assert(visible('station-properties') && visible('transfer-properties') && visible('element-properties') && visible('station-management'), '站点首签应显示内容、换乘、位置与站点操作');
      assert(!visible('line-number') && visible('export-png') && element('property-scroll').scrollTop === 0, '站点侧栏应从顶部显示相关属性及固定导出区');
      element('return-to-settings').click();
      assert(!app.selectedKey && visible('line-number') && editor.activeElement === element('property-heading'), '返回时应清除选择并恢复键盘焦点');
    });

    await test('双语名称、换乘颜色和底纹修改保留原有输入框及展开状态', function () {
      tab('appearance');
      element('line-pattern-enabled').click();
      const patternSource = element('line-pattern-source');
      change('line-pattern-source', 'line-10');
      assert(visible('line-pattern-source') && element('line-pattern-source') === patternSource, '调整底纹后原设置应保持打开');
      app.select(project.currentId);
      const name = editor.querySelector('[data-transfer-field="nameZh"]');
      const picker = name.closest('.transfer-color').querySelector('.color-picker');
      const palette = picker.querySelector('.cp-options');
      picker.querySelector('.cp-current').click();
      name.focus();
      name.value = '郊区线';
      name.dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true }));
      change('station-en', 'Updated Station', 'input');
      assert(editor.activeElement === name && !palette.hidden && name.isConnected, '文字编辑时应保留焦点、输入框和已展开的色板');
      const station = app.state.stations.find(station => station.id === project.currentId);
      assert(station.transfers[1].nameZh === '郊区线' && station.en === 'Updated Station', '相邻字段的修改应一并保存');
    });

    await test('独立添加数字和文字线路，按线路修改编号、保存配色、删除及撤销', function () {
      app.select(project.currentId);
      assert(visible('new-transfer-number') && visible('add-number-transfer') && visible('add-text-transfer'), '首签应有单独的数字和文字线路入口');
      const transfers = () => app.state.stations.find(station => station.id === project.currentId).transfers;
      const submitNumber = number => {
        change('new-transfer-number', number, 'input');
        element('add-number-transfer').click();
      };
      submitNumber('10');
      const row = element('transfer-colors').lastElementChild;
      const input = row.querySelector('[data-transfer-field="number"]');
      assert(input.value === '10' && transfers().at(-1).color === frame.contentWindow.SignCore.lineColorFor('10', 'chongqing').bg, '添加应自动匹配当前城市线路色');
      const color = row.querySelector('.cp-native');
      color.value = '#13579b';
      color.dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true }));
      input.value = '6';
      input.dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
      assert(transfers().at(-1).number === '6' && transfers().at(-1).color === '#13579B' && row === element('transfer-colors').lastElementChild, '修改编号应保留自定义颜色及原控件');
      row.querySelector('[data-control-icon="delete"]').click();
      assert(transfers().length === 2, '应只删除本条换乘线路');
      app.undo();
      assert(transfers().at(-1).number === '6', '应可撤销删除');
      element('add-text-transfer').click();
      assert(transfers().at(-1).type === 'text' && editor.activeElement.dataset.transferField === 'nameZh', '文字线路应直接进入中文名编辑');
      submitNumber('11'); submitNumber('12');
      assert(transfers().length === 6 && element('add-number-transfer').disabled && element('add-text-transfer').disabled, '达到六条后两个入口均应停用');
    });

    await test('左栏与浮动栏使用同款本站单图标，站点操作保留清楚的动作图标', function () {
      const first = project.stations[0].id;
      const action = editor.querySelector('[data-id="' + first + '"] .station-current');
      const current = editor.querySelector('[data-id="' + project.currentId + '"] .station-current');
      const win = frame.contentWindow;
      assert(action && icon(action, 'locate') && icon(element('tool-current'), 'locate'), '本站快捷按钮应是有提示的定位单图标');
      assert(win.getComputedStyle(action).pointerEvents === 'none' && win.getComputedStyle(current).pointerEvents === 'auto', '默认仅当前本站显示定位图标');
      assert(!editor.querySelector('.station-item-tag'), '本站卡片应去掉额外文字');
      action.focus();
      assert(win.getComputedStyle(action).pointerEvents === 'auto', '键盘聚焦时应显示定位按钮');
      action.click();
      assert(app.state.currentId === first && action.disabled && editor.activeElement === action.previousElementSibling, '左栏应设为本站并把焦点留在同一卡片');
      app.select(project.currentId);
      element('tool-current').click();
      assert(app.state.currentId === project.currentId, '浮动按钮应把选中的站点设为本站');
      assert(['station-up', 'station-down', 'station-delete'].every(id => element(id).dataset.controlIcon), '前移、后移和删除都应有图标');
    });

    await test('单独选中行车提示只显示位置，多选可同时微调、复位和撤销', function () {
      mode('station');
      app.selectElement('station:direction');
      assert(visible('element-properties') && !visible('station-properties') && !visible('station-management'), '行车提示应只显示位置');
      mode('route');
      const keys = project.stations.slice(0, 2).map(station => 'route:' + station.id);
      app.selectMany(keys, keys[0]);
      assert(!visible('station-properties') && !visible('element-offset-x') && visible('move-selection') && visible('delete-selected-stations'), '多选应显示整组操作');
      element('move-selection').querySelector('[data-nudge-x="1"]').click();
      assert(keys.every(key => app.state.adjustments[key].x === 1), '整组右移应改变每个选中元素的位置');
      element('reset-element').click();
      assert(keys.every(key => !app.state.adjustments[key]), '应能还原整组位置');
      app.undo();
      assert(keys.every(key => app.state.adjustments[key].x === 1) && visible('move-selection'), '撤销复位应恢复偏移和多选面板');
    });

    await test('本站吊板可以编辑列表中未画出的站点，多选只移动牌面上显示的元素', function () {
      const extra = state.addStation(project, project.stations[2].id);
      app.update(() => extra);
      mode('station');
      const hiddenStation = app.state.stations[3];
      const hiddenKey = 'route:' + hiddenStation.id;
      app.select(hiddenStation.id);
      assert(visible('station-properties') && !visible('element-properties'), '未画出的站点应只显示站点相关属性');
      const shownKey = app.scene.elements.find(item => item.stationId === project.currentId).key;
      app.selectMany([shownKey, hiddenKey], hiddenKey);
      element('move-selection').querySelector('[data-nudge-x="1"]').click();
      assert(app.state.adjustments[shownKey].x === 1 && !app.state.adjustments[hiddenKey], '移动位置只影响当前牌面上的元素');
      element('delete-selected-stations').click();
      assert(app.state.stations.length === 2 && visible('line-number'), '删除应一次提交，并返回整牌设置');
      app.undo();
      assert(app.state.stations.length === 4 && visible('delete-selected-stations'), '撤销删除应恢复原站点与选择');
    });

    await test('窄窗口横向滚动到右栏后，可使用色板、文字换乘、导出和删除控件', async function () {
      frame.style.width = '320px';
      frame.style.height = '720px';
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      assert(visible('export-png'), '整牌设置中应能找到导出按钮');
      element('export-png').scrollIntoView({ block: 'nearest' });
      assert(element('export-png').getBoundingClientRect().bottom <= 720, '应能滚动到导出按钮');
      app.select(project.currentId);
      editor.querySelectorAll('#transfer-colors .cp-current').forEach(button => button.click());
      element('station-delete').scrollIntoView({ block: 'nearest' });
      frame.contentWindow.scrollTo(editor.documentElement.scrollWidth, 0);
      const panel = element('property-scroll').getBoundingClientRect();
      const deleteButton = element('station-delete').getBoundingClientRect();
      assert(frame.contentWindow.scrollX > 0 && panel.left >= 0 && panel.right <= 321 &&
        element('property-scroll').scrollWidth <= element('property-scroll').clientWidth, '应能横向滚动到右栏且显示完整控件');
      assert(deleteButton.left >= panel.left && deleteButton.right <= panel.right && deleteButton.bottom <= frame.contentWindow.innerHeight + 1,
        '删除站点应可滚动到且完整显示，按钮底边为 ' + deleteButton.bottom + '，窗口高度为 ' + frame.contentWindow.innerHeight);
      const returnButton = element('return-to-settings').getBoundingClientRect();
      assert(returnButton.top >= 0 && returnButton.bottom <= panel.top, '右栏滚动到底后，返回按钮仍应在标题中可用');
    });
  } catch (error) {
    const result = document.createElement('li');
    result.className = 'fail';
    result.textContent = error.message;
    results.append(result);
  } finally {
    frame.remove();
    for (const key of Object.keys(localStorage).filter(key => key.includes('platform-sign'))) localStorage.removeItem(key);
    for (const [key, value] of saved) localStorage.setItem(key, value);
    const passed = results.querySelectorAll('.pass').length;
    document.getElementById('summary').textContent = passed + ' / ' + results.children.length + ' 通过';
    document.title = passed === results.children.length ? '✔ 站台属性面板测试全部通过' : '✖ 站台属性面板测试失败';
  }
})();
</script>
