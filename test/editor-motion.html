<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>编辑器页眉和动画测试</title>
<style>
  body { font: 14px system-ui; }
  iframe { display: block; width: 1280px; height: 860px; border: 1px solid #bbb; }
  .pass { color: #087338; }
  .fail { color: #bd2222; }
</style>
<h1>编辑器页眉和动画测试</h1>
<p id="summary" role="status">运行中…</p>
<ol id="results"></ol>
<iframe id="editor" title="测试用编辑器"></iframe>
<script>
(async function () {
  const frame = document.getElementById('editor');
  const results = document.getElementById('results');
  const storageKeys = ['public-sign-autosave', 'public-sign-instance', 'public-sign-prefs', 'public-sign-presets', 'public-sign-custom-palettes', 'public-platform-sign-project-v1', 'public-platform-sign-presets-v1', 'public-transfer-sign-project-v1'];
  const savedStorage = storageKeys.map(key => [key, localStorage.getItem(key)]);
  const editors = [
    { name: '导向标识', path: 'index.html', otherPath: 'platform.html', toolbar: '#element-toolbar', panel: '#right-panel-body', back: '#close-element-btn', heading: '#right-panel-title', palette: '#right-panel-body .cp-current' },
    { name: '站台标识', path: 'platform.html', otherPath: 'index.html', toolbar: '#platform-element-toolbar', panel: '#property-scroll', back: '#return-to-settings', heading: '#property-heading', palette: '#property-settings .cp-current' },
    { name: '换乘标识', path: 'index.html?editor=transfer', otherPath: 'platform.html', toolbar: '#transfer-element-toolbar', panel: '#transfer-property-scroll', back: '#transfer-return', heading: '#transfer-heading', palette: '#transfer-line-properties .cp-current' },
  ];
  const layouts = [
    { name: '导向标识', path: 'index.html', left: '#left-panel', middle: '#center-panel', right: '#right-panel' },
    { name: '换乘标识', path: 'index.html?editor=transfer', left: '#transfer-content', middle: '#transfer-preview', right: '#transfer-properties' },
    { name: '站台标识', path: 'platform.html', left: '.platform-stations', middle: '.platform-preview', right: '.platform-properties' },
  ];

  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }
  function load(path) {
    return new Promise(resolve => {
      frame.addEventListener('load', resolve, { once: true });
      frame.src = path;
    });
  }
  function repaint(window) {
    return new Promise(resolve => window.requestAnimationFrame(() => window.requestAnimationFrame(resolve)));
  }
  function animations(element, children = false) {
    element.getBoundingClientRect();
    return element.getAnimations({ subtree: children });
  }
  async function finishAnimations(playing) {
    await Promise.allSettled(playing.map(animation => animation.finished));
  }
  function movement(playing, from) {
    return playing.some(animation => {
      const frame = animation.effect.getKeyframes()[0];
      return frame.transform === 'translateX(' + from + 'px)' &&
        [frame.easing, animation.effect.getTiming().easing].some(easing => easing.startsWith('cubic-bezier('));
    });
  }
  async function test(name, run) {
    const result = document.createElement('li');
    try {
      await run();
      result.className = 'pass';
      result.textContent = name;
    } catch (error) {
      result.className = 'fail';
      result.textContent = name + '。' + error.message;
    }
    results.append(result);
  }

  try {
    storageKeys.forEach(key => localStorage.removeItem(key));
    for (const layout of layouts) {
      frame.style.width = '1396px';
      await load('../' + layout.path);
      const window = frame.contentWindow;
      const document = window.document;
      const bounds = selector => {
        const element = document.querySelector(selector);
        assert(element, '找不到 ' + selector);
        return element.getBoundingClientRect();
      };

      await test(layout.name + '：两侧栏贯穿桌面窗口，页眉与预览共用中间一栏', async function () {
        for (const width of [1396, 1280, 1200, 1180, 1100]) {
          frame.style.width = width + 'px';
          await repaint(window);
          const left = bounds(layout.left);
          const header = bounds('.editor-header');
          const middle = bounds(layout.middle);
          const right = bounds(layout.right);
          assert(left.width > 0 && right.width > 0 && left.top === 0 && right.top === 0 &&
            left.bottom === window.innerHeight && right.bottom === window.innerHeight, width + ' 像素宽时，两侧栏应从窗口顶部延伸到底部');
          assert(header.top === 0 && left.right === header.left && header.right === right.left &&
            header.bottom === middle.top && header.left === middle.left && header.right === middle.right,
            width + ' 像素宽时，页眉应与预览左右齐平并紧贴上方');
          const navigation = bounds('.editor-navigation');
          const heading = bounds('.editor-heading-actions');
          const repository = bounds('.editor-repository');
          assert(navigation.left >= header.left && navigation.right <= repository.left && repository.right <= header.right,
            width + ' 像素宽时，编辑器入口和仓库链接应完整放在中间一栏');
          const modes = document.querySelector('.mode-tabs:not([hidden])');
          if (modes) {
            const choices = modes.getBoundingClientRect();
            assert(Math.abs(choices.left + choices.right - header.left - header.right) <= 1, '版式选择应在页眉居中');
            assert(choices.top >= heading.bottom || (choices.left >= heading.right && choices.right <= repository.left),
              '版式选择不应遮住其他入口');
            assert(window.getComputedStyle(modes).borderTopWidth === '1px', '版式选择应放在同一组有边线的控件中');
          }
          const project = document.querySelector('.project-entry');
          if (!project.hidden) {
            const button = project.getBoundingClientRect();
            assert(project.previousElementSibling.matches('.editor-navigation') && button.left >= navigation.right &&
              button.left - navigation.right <= 12 && button.bottom <= heading.bottom, '我的项目应紧接在标题右侧');
          }
          const panelHeader = document.querySelector(layout.left + ' .panel-header');
          assert(window.getComputedStyle(panelHeader).backgroundColor === 'rgba(0, 0, 0, 0)', '左栏标题应沿用栏内底色');
        }
      });

      {
        await test(layout.name + '：分别收起和展开两侧栏，页眉与预览随之改变宽度', async function () {
          frame.style.width = '1396px';
          await repaint(window);
          for (const selector of [layout.left, layout.right]) {
            const panel = document.querySelector(selector);
            const collapse = panel.querySelector('[data-panel-toggle]');
            const expander = document.querySelector('.expander[aria-controls="' + panel.id + '"]');
            assert(collapse && expander, '应有一对带有可读名称的收起、展开按钮');
            const openWidth = bounds('.editor-header').width;
            collapse.click();
            assert(panel.inert && document.activeElement === expander, '收起时侧栏应立即停止响应，焦点应移到展开按钮');
            assert(expander.getAttribute('aria-expanded') === 'false', '展开按钮应说明侧栏已收起');
            await finishAnimations(animations(panel));
            const header = bounds('.editor-header');
            const middle = bounds(layout.middle);
            const button = expander.getBoundingClientRect();
            assert(header.width > openWidth && header.left === middle.left && header.right === middle.right, '收起后页眉应与预览一起变宽');
            assert(button.top >= header.bottom && document.elementFromPoint(button.left + button.width / 2, button.top + button.height / 2) === expander,
              '展开按钮应位于页眉下方且可点击');
            expander.click();
            await finishAnimations(animations(panel));
            assert(expander.hidden && !panel.inert && bounds('.editor-header').width === openWidth &&
              document.activeElement === collapse && collapse.getAttribute('aria-expanded') === 'true', '展开后应恢复宽度和键盘焦点');
          }
          if (layout.path === 'platform.html') {
            await window.App.ready;
            const properties = document.querySelector(layout.right);
            properties.querySelector('[data-panel-toggle]').click();
            document.getElementById('add-station').click();
            assert(!properties.inert && document.activeElement === document.getElementById('station-zh'),
              '添加站点后应打开属性面板并聚焦站名');
          }
        });
      }

      if (layout.path === 'platform.html') {
        await test('站台左栏普通站点用透明边线，本站保留定位标记', async function () {
          await window.App.ready;
          if (document.querySelectorAll('.station-item').length < 2) document.getElementById('add-station').click();
          const current = document.querySelector('.station-current:disabled')?.closest('.station-item');
          const other = [...document.querySelectorAll('.station-item')].find(item => item !== current && !item.querySelector('[aria-pressed="true"]'));
          if (!other) window.App.deselect();
          const row = other || [...document.querySelectorAll('.station-item')].find(item => item !== current);
          assert(current && row && window.getComputedStyle(row).borderTopColor === 'rgba(0, 0, 0, 0)', '普通站点的边框不应切碎列表');
          assert(window.getComputedStyle(current).backgroundColor !== window.getComputedStyle(row).backgroundColor, '本站应保留底色和定位按钮');
        });
      }

      if (document.querySelector('.mode-tabs:not([hidden])')) {
        await test(layout.name + '：窄窗口收起属性栏后，版式按钮和仓库入口仍然各自可用', async function () {
          frame.style.width = '1100px';
          await repaint(window);
          const panel = document.querySelector(layout.right);
          const expand = document.querySelector('.expander[aria-controls="' + panel.id + '"]');
          panel.querySelector('[data-panel-toggle]').click();
          await finishAnimations(animations(panel));
          try {
            const modes = bounds('.mode-tabs:not([hidden])');
            const actions = bounds('.project-header-actions');
            const header = bounds('.editor-header');
            assert(actions.right <= header.right && (modes.top >= actions.bottom || modes.right <= actions.left),
              '仓库入口不应遮住版式按钮');
          } finally {
            expand.click();
            await finishAnimations(animations(panel));
          }
        });
      }

      await test(layout.name + '：窄窗口继续使用桌面三栏，横向滚动可到达右栏', async function () {
        for (const width of [768, 390, 320]) {
          frame.style.width = width + 'px';
          await repaint(window);
          window.scrollTo(0, 0);
          const header = bounds('.editor-header');
          const content = bounds(layout.left);
          const preview = bounds(layout.middle);
          const properties = bounds(layout.right);
          assert(content.top === 0 && properties.top === 0 && header.top === 0 &&
            content.right === header.left && header.right === properties.left && header.bottom === preview.top &&
            preview.left === header.left && preview.right === header.right && preview.width > 400,
            width + ' 像素宽时仍应显示完整的桌面三栏');
          assert(document.documentElement.scrollWidth >= 1100, '桌面布局应保留至少 1100 像素宽');
          window.scrollTo(document.documentElement.scrollWidth, 0);
          assert(window.scrollX > 0 && bounds(layout.right).right <= width + 1, '应能横向滚动到右栏');
        }
      });
      await load('about:blank');
    }
    for (const editor of editors) {
      frame.style.width = '1280px';
      await load('../' + editor.path);
      const window = frame.contentWindow;
      const document = window.document;
      const app = window.App;
      const toolbar = document.querySelector(editor.toolbar);
      const panel = document.querySelector(editor.panel);
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let select, selectNext, deselect, update;

      if (editor.path === 'index.html') {
        const deadline = Date.now() + 10000;
        while (!app.measure && Date.now() < deadline) await repaint(window);
        assert(app.measure, '导向标识编辑器初始化超时');
        const state = window.SignState;
        const sign = state.addRow(state.createSign());
        const element = state.createElement('bilingual-text', { textZh: '测试站', textEn: 'Test Station' });
        const next = state.createElement('bilingual-text', { textZh: '下一站', textEn: 'Next Station' });
        app.update(() => state.addElement(state.addElement(sign, sign.rows[0].id, element), sign.rows[1].id, next));
        select = () => app.select(element.id);
        selectNext = () => app.select(next.id);
        deselect = () => app.select(null);
        update = () => app.update(current => state.updateElementProps(current, element.id, { textZh: '新站名' }));
      } else if (editor.path === 'platform.html') {
        await app.ready;
        const state = window.PlatformState;
        app.update(current => state.addStation(current, current.currentId));
        select = () => app.select(app.state.currentId);
        selectNext = () => app.select(app.state.stations.find(station => station.id !== app.state.currentId).id);
        deselect = () => app.deselect();
        update = () => app.update(current => state.patchStation(current, current.currentId, { zh: '新站名' }));
      } else {
        await app.ready;
        const selectLine = name => document.querySelector('[data-transfer-element="line:' + name + '"]')
          .dispatchEvent(new window.MouseEvent('click', { bubbles: true }));
        select = () => selectLine('first');
        selectNext = () => selectLine('second');
        deselect = () => document.getElementById('transfer-preview-scroll').click();
        update = () => app.update(current => window.TransferState.changeLine(current, 'first', { name: '11' }));
      }
      deselect();
      await repaint(window);

      await test(editor.name + '：仓库按钮无底色、有浅色描边，文案和页眉入口完整显示', async function () {
        const sample = document.createElement('canvas');
        sample.width = sample.height = 1;
        const brush = sample.getContext('2d', { willReadFrequently: true });
        function colorChannels(color) {
          brush.clearRect(0, 0, 1, 1);
          brush.fillStyle = color;
          brush.fillRect(0, 0, 1, 1);
          return brush.getImageData(0, 0, 1, 1).data;
        }
        for (const width of [1280, 1100]) {
          frame.style.width = width + 'px';
          await repaint(window);
          const navigation = document.querySelector('.editor-navigation');
          const current = navigation?.querySelector('[aria-current="page"]');
          const other = navigation?.querySelector('a[href="' + editor.otherPath + '"]');
          const repository = document.querySelector('.editor-repository');
          assert(navigation?.closest('.editor-header') && repository?.closest('.editor-header'),
            '编辑器入口和仓库链接应放在页眉');
          assert(navigation.querySelector('a[href="index.html?editor=transfer"]'), '页眉缺少换乘标识入口');
          assert(current?.getAttribute('href') === editor.path, '当前页应有明确标记');
          assert(other?.getAttribute('href') === editor.otherPath, '另一个编辑器应可直接打开');
          assert(repository?.host === 'github.com' && repository.pathname === '/PrisamaX0124/CRT-Sign-Web-Editor', '仓库链接不正确');
          assert(repository.querySelector('svg') && repository.textContent.trim() === '>',
            '仓库按钮只应显示 GitHub 图标和右箭头');
          assert(repository.getAttribute('aria-label') === '在新标签页打开 GitHub 仓库' &&
            repository.target === '_blank' && repository.relList.contains('noopener'), '读屏名称应说明按钮用途');
          const appearance = window.getComputedStyle(repository);
          assert(colorChannels(appearance.backgroundColor)[3] === 0 && appearance.boxShadow === 'none', '仓库按钮应无底色和阴影');
          const border = colorChannels(appearance.borderTopColor);
          const text = colorChannels(appearance.color);
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          assert(appearance.borderTopStyle === 'solid' && parseFloat(appearance.borderTopWidth) > 0 &&
            border[3] >= 40 && border[3] <= 100 && border[2] > border[0], '仓库按钮应有淡蓝灰色描边');
          assert(text[3] === 255 && text[2] > text[0] && (dark ? text[0] > 150 : text[2] < 150), '文字应随主题切换并保持清楚');
          const left = navigation.getBoundingClientRect();
          const right = repository.getBoundingClientRect();
          assert(left.left >= 0 && left.right < right.left && right.right <= width + 1, '两组入口应在页眉左右且完整显示');
          assert(Math.abs(left.top - right.top) < 1 && document.documentElement.scrollWidth <= width + 1, '切换入口和仓库链接应保持在同一行');
        }
        frame.style.width = '1280px';
        await repaint(window);
      });

      await test(editor.name + '：页眉用当前编辑器的大标题展开导航，键盘和鼠标都能收起', async function () {
        const navigation = document.querySelector('.editor-navigation');
        const toggle = navigation.querySelector('button');
        const choices = toggle && document.getElementById(toggle.getAttribute('aria-controls'));
        const modeTabs = document.querySelector('.editor-header .mode-tabs:not([hidden])');
        assert(toggle && choices && !navigation.querySelector('select'), '应使用自定义按钮和链接');
        assert(toggle.textContent.trim() === editor.name + '编辑器' && parseFloat(window.getComputedStyle(toggle).fontSize) >= 18,
          '大标题应显示当前编辑器的全称');
        assert(choices.hidden && toggle.getAttribute('aria-expanded') === 'false', '导航应默认收起');
        const links = [...choices.querySelectorAll('a')];
        assert(links.map(link => link.getAttribute('href')).join(',') === 'index.html,index.html?editor=transfer,platform.html' &&
          links.map(link => link.textContent.trim()).join(',') === '导向标识,换乘标识,站台标识' &&
          choices.querySelector('[aria-current="page"]').textContent.trim() === editor.name, '应保留三个入口的简称并标明当前页');
        function key(target, key) {
          target.dispatchEvent(new window.KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
        }
        for (const width of [1280, 1100]) {
          frame.style.width = width + 'px';
          await repaint(window);
          const header = navigation.closest('.editor-header');
          const before = header.getBoundingClientRect();
          toggle.click();
          assert(!choices.hidden && toggle.getAttribute('aria-expanded') === 'true', '点击标题应展开导航');
          const opened = choices.getBoundingClientRect();
          const title = toggle.getBoundingClientRect();
          assert(opened.top >= title.bottom && opened.left >= before.left && opened.right <= before.right &&
            header.getBoundingClientRect().height === before.height, '下拉菜单应在标题下方，且不挤动画布');
          if (modeTabs) {
            const tabs = modeTabs.getBoundingClientRect();
            assert(opened.right <= tabs.left || opened.top >= tabs.bottom, '菜单展开后不应遮住版式选择');
          }
          key(toggle, 'ArrowDown');
          assert(document.activeElement === links[0], '向下键应进入第一项');
          key(links[0], 'ArrowUp');
          assert(document.activeElement === links.at(-1), '向上键应移动到上一项');
          key(document.activeElement, 'Escape');
          assert(choices.hidden && document.activeElement === toggle, '退出后焦点应回到标题');
          toggle.click();
          (modeTabs?.querySelector('[aria-pressed="true"]') || header.querySelector('.editor-header-content')).dispatchEvent(
            new window.MouseEvent('click', { bubbles: true, cancelable: true }));
          assert(choices.hidden, '点击菜单以外的位置应收起');
          toggle.click();
          header.querySelector('.editor-repository').focus();
          assert(choices.hidden, '焦点离开导航时应收起');
        }
        frame.style.width = '1280px';
        await repaint(window);
      });

      await test(editor.name + '：菜单右侧显示三种标识的示例，展开时菜单和选项依次出现', async function () {
        const toggle = document.querySelector('.editor-switch');
        const choices = document.querySelector('.editor-choices');
        const links = [...choices.querySelectorAll('a')];
        toggle.click();
        try {
          const menuMotion = animations(choices).find(animation => animation instanceof window.CSSAnimation);
          const itemMotion = links.map(link => animations(link).find(animation => animation instanceof window.CSSAnimation));
          const previews = links.map(link => link.querySelector('img'));
          assert(previews.every(Boolean) && new Set(previews.map(preview => preview.src)).size === 3, '应有三张不同的标识牌预览');
          if (reduced) {
            assert(!menuMotion && itemMotion.every(animation => !animation), '减少动态效果时应直接显示菜单和选项');
          } else {
            assert(menuMotion && itemMotion.every(Boolean), '菜单和每个选项都应播放出现动画');
            const delays = itemMotion.map(animation => animation.effect.getTiming().delay);
            assert(delays[0] < delays[1] && delays[1] < delays[2], '选项应依次出现');
            await finishAnimations([menuMotion, ...itemMotion]);
          }
          await Promise.all(previews.map(preview => preview.decode()));
          assert(choices.getBoundingClientRect().width >= 300, '菜单应留出足够的预览宽度');
          links.forEach((link, index) => {
            const label = link.querySelector('span').getBoundingClientRect();
            const image = previews[index].getBoundingClientRect();
            assert(previews[index].naturalWidth > 200 && image.width >= 130 && image.left >= label.right,
              '预览图应清楚显示在名称右侧');
          });
        } finally {
          toggle.click();
        }
      });

      await test(editor.name + '：导向预览显示黄底黑字，换乘预览的两种版式都显示红蓝线路色', async function () {
        const [guidance, transfer] = document.querySelectorAll('.editor-choices img');
        await Promise.all([guidance.decode(), transfer.decode()]);
        const canvas = document.createElement('canvas');
        canvas.width = guidance.naturalWidth;
        canvas.height = guidance.naturalHeight;
        const drawing = canvas.getContext('2d');
        function countColor(left, width, color) {
          const pixels = drawing.getImageData(left, 0, width, canvas.height).data;
          let count = 0;
          for (let index = 0; index < pixels.length; index += 4) {
            if (pixels[index] === color[0] && pixels[index + 1] === color[1] &&
                pixels[index + 2] === color[2] && pixels[index + 3] === 255) count++;
          }
          return count;
        }
        drawing.drawImage(guidance, 0, 0);
        assert(countColor(0, canvas.width, [255, 215, 0]) > 10000 && countColor(0, canvas.width, [0, 0, 0]) > 1000,
          '导向预览应显示黄色牌面和黑色箭头及文字');
        drawing.clearRect(0, 0, canvas.width, canvas.height);
        drawing.drawImage(transfer, 0, 0);
        const halfWidth = canvas.width / 2;
        for (const left of [0, halfWidth]) {
          assert(countColor(left, halfWidth, [228, 0, 43]) > 30 && countColor(left, halfWidth, [0, 61, 165]) > 30,
            '每种换乘版式都应显示 1 号线红色和 3 号线蓝色');
        }
      });

      await test(editor.name + '：仓库按钮缓慢扫光，光带微弱且不影响布局和点击，减少动态效果时关闭', async function () {
        const repository = document.querySelector('.editor-repository');
        const shine = window.getComputedStyle(repository, '::before');
        const playing = animations(repository, true).filter(animation => animation instanceof window.CSSAnimation);
        if (reduced) {
          assert(playing.length === 0 && shine.animationName === 'none' && shine.content === 'none', '减少动态效果时应移除扫光');
          return;
        }
        assert(playing.length === 1, '仓库按钮应有一条扫光动画');
        assert(shine.pointerEvents === 'none' && parseFloat(shine.opacity) > 0 && parseFloat(shine.opacity) <= .08,
          '光带应足够微弱，并允许点击穿过');
        assert(window.getComputedStyle(repository).overflow === 'hidden', '光带应限制在按钮范围内');
        const animation = playing[0];
        const timing = animation.effect.getTiming();
        assert(timing.duration >= 8000 && timing.iterations === Infinity, '扫光应至少每八秒重复一次');
        const before = repository.getBoundingClientRect();
        const positions = [];
        animation.pause();
        try {
          for (const progress of [.2, .425, .65, .85]) {
            animation.currentTime = timing.duration * progress;
            await repaint(window);
            positions.push(new window.DOMMatrixReadOnly(window.getComputedStyle(repository, '::before').transform).m41);
            assert(repository.contains(document.elementFromPoint(before.x + before.width / 2, before.y + before.height / 2)),
              '扫光期间按钮应能点击');
          }
          assert(positions[0] < -before.width * .9 && Math.abs(positions[1]) < before.width * .1 &&
            positions[2] > before.width * .9 && Math.abs(positions[2] - positions[3]) < 1,
            '光带应缓慢经过按钮，并在两次扫光之间停留在按钮外');
          const after = repository.getBoundingClientRect();
          assert(before.x === after.x && before.y === after.y && before.width === after.width && before.height === after.height,
            '扫光不应改变按钮的位置和尺寸');
        } finally {
          animation.play();
        }
      });

      await test(editor.name + '：状态和快捷键放在底栏，缩放和锁定位于右下角', async function () {
        const visibleCenter = Array.from(document.querySelectorAll('.editor-center')).find(center => center.getClientRects().length);
        const footer = visibleCenter.querySelector('.editor-footer');
        const heading = visibleCenter.querySelector('.preview-toolbar');
        const controls = footer.querySelector('.preview-zoom');
        const saveStatus = footer.querySelector('.project-save');
        assert(controls?.querySelector('select') && controls.querySelectorAll('[data-zoom-step]').length === 2, '底栏应有缩放菜单和两个调节按钮');
        const position = controls.querySelector('.preview-position-lock');
        assert(!position.textContent.trim() &&
          position.querySelector('svg[aria-hidden="true"]')?.getBoundingClientRect().width > 0 && position.getAttribute('aria-label'),
          '拖动和锁定应由一个带可读名称的图标按钮切换');
        try {
          for (const width of [1280, 1100, 375]) {
            frame.style.width = width + 'px';
            await repaint(window);
            const bounds = footer.getBoundingClientRect();
            const zoom = controls.getBoundingClientRect();
            const status = saveStatus.getBoundingClientRect();
            assert(bounds.height <= 42 && footer.scrollWidth <= footer.clientWidth + 1, '底部栏应保持一行高度并且没有横向溢出');
            assert(zoom.top >= bounds.top && zoom.bottom <= bounds.bottom && zoom.right <= bounds.right && bounds.right - zoom.right < 20 &&
              !heading.querySelector('.preview-zoom') && heading.scrollWidth <= heading.clientWidth + 1, '画布控件应完整放在右下角');
            const dimensions = heading.querySelector('.preview-dimensions');
            assert(/^\d+ × \d+ 像素$/.test(dimensions.textContent), '三个编辑器的牌面尺寸应使用相同的单位');
            const canvas = visibleCenter.querySelector('.preview-zoom-viewport');
            const pattern = window.getComputedStyle(canvas).backgroundImage;
            assert(pattern.includes('radial-gradient'), '画布应有点阵，区分工作区和标识牌');
            assert(status.top >= bounds.top && status.bottom <= bounds.bottom, '保存状态应留在底部栏');
            const help = footer.querySelector('details');
            const trigger = help?.querySelector('summary');
            assert(trigger && !help.open, '快捷键说明应默认收起');
            trigger.click();
            const hint = help.querySelector('.shortcut-hint');
            const key = hint.querySelector('kbd');
            assert(help.open && key.getClientRects().length && parseFloat(window.getComputedStyle(key).borderRadius) > 0, '应能展开原有的快捷键提示');
            assert(hint.querySelector('.shortcut-description')?.textContent.trim(), '按键右边应显示操作说明');
            assert(hint.getBoundingClientRect().bottom < bounds.top && footer.getBoundingClientRect().height === bounds.height,
              '展开提示不应增加底部栏高度');
            trigger.click();
          }
        } finally {
          frame.style.width = '1280px';
          await repaint(window);
        }
      });

      await test(editor.name + '：预览栏可撤销和重做，牌面与按钮及时更新', function () {
        const history = Array.from(document.querySelectorAll('.preview-toolbar .history-actions'))
          .find(group => group.getClientRects().length);
        const [undo, redo] = history?.querySelectorAll('button') || [];
        const previous = app.state;
        update();
        assert(undo && redo && !undo.disabled && redo.disabled, '有修改后应能撤销，尚未撤销时应禁用重做');
        const edited = app.state;
        undo.click();
        assert(JSON.stringify(app.state) === JSON.stringify(previous) && !redo.disabled, '撤销应恢复上一步并启用重做');
        redo.click();
        assert(JSON.stringify(app.state) === JSON.stringify(edited) && redo.disabled, '重做应恢复修改并同步按钮状态');
        undo.click();
      });

      if (editor.path.includes('editor=transfer')) {
        await test('换乘标识：线路和箭头可从列表点选，列表随牌面选择更新并保留按钮', async function () {
          const line = document.querySelector('#transfer-groups [data-select-line]');
          const arrow = document.querySelector('#transfer-groups .transfer-group-arrow');
          const target = button => document.querySelector('[data-transfer-element="' + button.dataset.selectTransfer + '"]');
          assert(line && arrow && line.getAttribute('aria-pressed') === 'false' &&
            arrow.getAttribute('aria-pressed') === 'false', '未选中时列表按钮应处于未按下状态');
          line.click();
          assert(line.getAttribute('aria-pressed') === 'true' && target(line).getAttribute('aria-pressed') === 'true',
            '从列表选线路后两处都应高亮');
          const properties = document.getElementById('transfer-properties');
          properties.querySelector('[data-panel-toggle]').click();
          document.getElementById('transfer-tool-edit').click();
          assert(!properties.inert && document.activeElement === document.getElementById('transfer-line-name'),
            '点编辑线路时应打开属性面板并聚焦名称');
          target(arrow).dispatchEvent(new window.MouseEvent('click', { bubbles: true }));
          assert(line.getAttribute('aria-pressed') === 'false' && arrow.getAttribute('aria-pressed') === 'true',
            '从牌面选箭头后列表应同步');
          assert(document.querySelector('#transfer-groups [data-select-line]') === line &&
            document.querySelector('#transfer-groups .transfer-group-arrow') === arrow, '切换选区时应保留原有按钮');
          deselect();
          assert(arrow.getAttribute('aria-pressed') === 'false', '取消选择后应清除列表高亮');
        });
      }

      if (editor.path === 'index.html' || editor.path === 'platform.html') {
        await test(editor.name + '：剪贴板留在标题栏，以图标显示并保留可读名称', async function () {
          const dock = document.querySelector('#edit-actions, #platform-edit-actions');
          const copy = dock.querySelector('[data-edit-action="copy"]');
          const cut = dock.querySelector('[data-edit-action="cut"]');
          assert(copy.disabled && cut.disabled, '未选中内容时应禁用复制和剪切');
          select();
          assert(!copy.disabled && !cut.disabled, '选中可编辑内容后应启用复制和剪切');
          for (const width of [1280, 1100]) {
            frame.style.width = width + 'px';
            await repaint(window);
            const bounds = dock.getBoundingClientRect();
            const heading = dock.closest('.preview-toolbar');
            assert(heading && !dock.closest('.editor-footer'), '剪贴板应移到标题栏');
            const history = heading.querySelector('.history-actions').getBoundingClientRect();
            assert(bounds.right <= history.left && bounds.top < history.bottom && bounds.bottom > history.top, '剪贴板与撤销应同排');
            assert(dock.scrollWidth <= dock.clientWidth, '未打开提示时，工具栏宽度应只包括操作按钮');
            for (const button of dock.querySelectorAll('button[data-edit-action]')) {
              assert(button.getAttribute('aria-label') && window.getComputedStyle(button, '::before').maskImage !== 'none' && !button.querySelector('svg'),
                '剪贴板按钮应显示图标并保留可读名称');
              assert(button.querySelector('.control-hint kbd'), '剪贴板按钮应提供按键提示');
            }
          }
          frame.style.width = '1280px';
          deselect();
          await repaint(window);
        });

        await test(editor.name + '的删除按钮随主题切换，保留红色垃圾桶', async function () {
          const guide = editor.path === 'index.html';
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          select();
          const remove = document.querySelector(guide ? '#right-panel-body [data-control-icon="delete"]' : '#station-delete');
          assert(remove, '缺少删除按钮');
          const background = window.getComputedStyle(remove).backgroundColor;
          const channels = background.match(/\d+/g).slice(0, 3).map(Number);
          assert(dark ? Math.max(...channels) < 100 : background === 'rgb(255, 255, 255)', '删除按钮底色应随主题切换');
          const trash = window.getComputedStyle(remove, '::before');
          const trashIcon = trash.maskImage;
          const [red, green, blue] = trash.backgroundColor.match(/\d+/g).map(Number);
          assert(red > green && red > blue && trashIcon !== 'none', '删除应使用红色垃圾桶');
          deselect();
          if (!guide) return;
          const clear = document.querySelector('#right-panel-body [data-control-icon="clear"]');
          assert(clear && window.getComputedStyle(clear).backgroundColor === 'rgb(233, 21, 45)', '清空按钮应为红底');
          const clearStyle = window.getComputedStyle(clear, '::before');
          const clearIcon = clearStyle.maskImage;
          assert(clearStyle.backgroundColor === 'rgb(255, 255, 255)' && clearIcon !== 'none' && clearIcon !== trashIcon,
            '清空应使用独立的白色图标');
          const image = new window.Image();
          image.src = clearIcon.slice(5, -2);
          await image.decode();
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = 32;
          const drawing = canvas.getContext('2d');
          drawing.drawImage(image, 0, 0, 32, 32);
          const opacity = (horizontal, vertical) => drawing.getImageData(horizontal, vertical, 1, 1).data[3];
          assert(opacity(16, 3) === 255 && opacity(3, 16) === 255 && opacity(16, 28) === 255 && opacity(28, 16) === 255 &&
            opacity(2, 2) === 0 && opacity(16, 16) === 0 && opacity(12, 12) === 0 && opacity(20, 12) === 0 &&
            opacity(16, 11) === 255, '清空图标应为圆形，中间镂空叉号');
          clear.click();
          const dialog = document.querySelector('.modal-mask');
          const confirm = dialog.querySelector('[data-act="ok"][data-control-icon="clear"]');
          assert(confirm && window.getComputedStyle(confirm, '::before').maskImage === clearIcon, '清空确认按钮应显示相同图标');
          dialog.querySelector('[data-act="cancel"]').click();
          await finishAnimations(animations(dialog, true));
        });
      }

      await test(editor.name + '：黑白灰用于编辑界面，牌面继续显示项目里的颜色', function () {
        function grayscale(color) {
          const components = color.match(/\d+/g).map(Number);
          return components[0] === components[1] && components[1] === components[2];
        }
        const page = document.querySelector(editor.path === 'index.html' ? '#center-panel' : '.platform-preview');
        const current = document.querySelector('.editor-navigation [aria-current="page"]');
        assert(grayscale(window.getComputedStyle(document.body).backgroundColor) &&
          grayscale(window.getComputedStyle(current).backgroundColor), '编辑区背景和选中入口应使用灰阶颜色');
        if (editor.path === 'index.html') {
          app.update(state => window.SignState.updateSignSettings(state, { backgroundColor: '#173B57' }));
          const signBackground = page.querySelector('#sign-svg rect[fill="#173B57"]');
          assert(signBackground, '牌面应保留自定义背景色');
        } else if (editor.path === 'platform.html') {
          app.update(state => window.PlatformState.settings(state, { color: '#173B57' }));
          const line = page.querySelector('#platform-svg [fill="#173B57"]');
          assert(line, '牌面应保留线路色');
        } else {
          app.update(state => window.TransferState.changeLine(state, 'first', { color: '#173B57' }));
          assert(page.querySelector('#transfer-sign [data-role="line-band"][fill="#173B57"]'), '牌面应保留线路色');
        }
      });

      await test(editor.name + '：浮动工具栏进入、退出和打断退出后都能继续操作', async function () {
        select();
        const entering = animations(toolbar);
        assert(!toolbar.hidden && !toolbar.inert, '选中后浮动工具栏应立即可操作');
        if (reduced) assert(entering.length === 0, '减少动态效果时应直接出现');
        else assert(entering.some(animation => animation.transitionProperty === 'opacity'), '出现时应渐入');
        await finishAnimations(entering);

        deselect();
        const leaving = animations(toolbar);
        assert(toolbar.hidden && toolbar.inert, '退出时应立即停止响应操作');
        if (reduced) assert(leaving.length === 0 && window.getComputedStyle(toolbar).display === 'none', '减少动态效果时应立即隐藏');
        else assert(leaving.some(animation => animation.transitionProperty === 'opacity') && window.getComputedStyle(toolbar).display !== 'none', '退出动画结束前应仍能看到工具栏');
        select();
        await finishAnimations(animations(toolbar));
        assert(!toolbar.hidden && !toolbar.inert && window.getComputedStyle(toolbar).opacity === '1', '再次选中应恢复工具栏');
        deselect();
        await finishAnimations(animations(toolbar));
        assert(window.getComputedStyle(toolbar).display === 'none', '退出结束后应完全隐藏');
      });

      await test(editor.name + '：属性从右侧进入，返回从左侧进入，修改内容不重播', async function () {
        await finishAnimations(animations(panel, true));
        select();
        const forward = animations(panel, true);
        assert(reduced ? forward.length === 0 : movement(forward, 12), '进入属性时的动画不正确');
        await finishAnimations(forward);
        update();
        assert(animations(panel, true).length === 0, '普通编辑不应触发动画');
        document.querySelector(editor.back).click();
        const backward = animations(panel, true);
        assert(reduced ? backward.length === 0 : movement(backward, -12), '返回标识牌设置时的动画不正确');
        assert(document.activeElement === document.querySelector(editor.heading), '返回后键盘焦点应落在设置标题');
        await finishAnimations(backward);
      });

      await test(editor.name + '：快速切换选中元素时，工具栏从当前位置移动', async function () {
        const position = () => {
          const bounds = toolbar.getBoundingClientRect();
          return [bounds.left, bounds.top];
        };
        const displacement = (before, after) => Math.hypot(before[0] - after[0], before[1] - after[1]);
        const travel = () => animations(toolbar).find(animation => 'translate' in animation.effect.getKeyframes()[0]);
        select();
        await finishAnimations(animations(toolbar));
        selectNext();
        const moving = travel();
        assert(reduced ? !moving : !!moving, '切换选中元素时的移动未遵循减少动态效果设置');
        if (moving) {
          moving.pause();
          moving.currentTime = moving.effect.getTiming().duration / 3;
          const between = position();
          select();
          const returning = travel();
          assert(returning, '中途返回时应继续移动');
          returning.currentTime = 0;
          assert(displacement(between, position()) < 2, '返回时工具栏应接着当前位置移动');
          await finishAnimations(animations(toolbar));
        }
        assert(!toolbar.hidden && !toolbar.inert, '移动结束后工具栏仍应可操作');
        deselect();
      });

      await test(editor.name + '的右栏色板每行八个圆形色块，快速开合后保持可用', async function () {
        deselect();
        if (editor.path.includes('transfer')) select();
        const button = document.querySelector(editor.palette);
        const options = document.getElementById(button.getAttribute('aria-controls'));
        button.click();
        assert(!options.hidden && !options.inert && button.getAttribute('aria-expanded') === 'true', '色板应在开始展开时就可以操作');
        const opening = animations(options).find(animation => animation.transitionProperty === 'grid-template-rows');
        assert(reduced ? !opening : !!opening, '色板应随内容高度过渡');
        if (opening) opening.currentTime = opening.effect.getTiming().duration / 3;
        button.click();
        assert(options.hidden && options.inert && button.getAttribute('aria-expanded') === 'false', '收起的色板应立刻退出键盘操作');
        button.click();
        await finishAnimations(animations(options));
        assert(!options.hidden && options.getBoundingClientRect().height > 30 && options.querySelector('.cp-swatch'), '再次展开后应完整显示色块');
        const color = options.querySelector('.cp-swatch');
        const colorStyle = window.getComputedStyle(color);
        const colorBounds = color.getBoundingClientRect();
        assert(Math.abs(colorBounds.width - colorBounds.height) < 1 && colorStyle.borderRadius === '50%' &&
          (!colorStyle.cornerShape || ['round', 'superellipse(1)'].includes(colorStyle.cornerShape)),
          '城市色板应使用正圆色块');
        const picker = button.closest('.color-picker');
        assert(window.getComputedStyle(button).borderRadius === '7px' &&
          window.getComputedStyle(picker.querySelector('.current-color')).borderRadius === '4px' &&
          window.getComputedStyle(options.querySelector('.custom-color')).borderRadius === '6px' &&
          window.getComputedStyle(picker.querySelector('.hex-input')).borderRadius === '6px', '颜色按钮、色样、自选颜色和输入框应使用原有圆角');
        const swatches = Array.from(options.querySelectorAll('.cp-swatch'), swatch => swatch.getBoundingClientRect());
        assert(swatches.length > 8 && swatches.slice(0, 8).every(swatch => swatch.top === swatches[0].top) &&
          swatches[8].top > swatches[0].top, '右侧栏每排应有八个色块');
        button.click();
        await finishAnimations(animations(options));
        assert(window.getComputedStyle(options).display === 'none', '收起后应释放占用空间');
        deselect();
      });

      if (editor.path !== 'index.html') {
        await test(editor.name + '：底纹开关的圆点与设置面板一起过渡', async function () {
          if (editor.path.includes('transfer')) select();
          document.querySelector('[data-property-tab-button="appearance"]').click();
          const button = document.getElementById('line-pattern-enabled');
          const options = document.getElementById('line-pattern-controls');
          button.getBoundingClientRect();
          button.click();
          const thumb = animations(button, true).some(animation => animation.transitionProperty === 'translate');
          const opening = animations(options);
          const expanding = opening.some(animation => animation.transitionProperty === 'grid-template-rows');
          assert(button.getAttribute('aria-checked') === 'true' && !options.inert, '底纹启用后应立即能操作设置');
          assert(reduced ? !thumb && !expanding : thumb && expanding, '圆点与面板的过渡应遵循减少动态效果设置');
          await finishAnimations(opening);
          button.click();
          assert(button.getAttribute('aria-checked') === 'false' && options.inert, '底纹收起时应立即停用设置');
          await finishAnimations(animations(options));
          deselect();
        });
      }

      if (editor.path === 'index.html' || editor.path === 'platform.html') {
        await test(editor.name + '：切换预设标签时，按钮与内容同时过渡', async function () {
          const guide = editor.path === 'index.html';
          const button = document.querySelector(guide ? '#palette-tab-presets' : '[data-library="presets"]');
          const pane = () => document.querySelector(guide ? '#palette-content' : '#preset-library');
          const base = document.querySelector(guide ? '#palette-tab-elements' : '[data-library="stations"]');
          button.getBoundingClientRect();
          button.click();
          const highlight = animations(button).some(animation => animation.transitionProperty === 'background-color');
          const reveal = animations(pane());
          assert(reduced ? !highlight && reveal.length === 0 : highlight && movement(reveal, 12), '标签状态和内容应同时切换');
          await finishAnimations(reveal);
          base.click();
          await finishAnimations(animations(pane()));
        });

        await test(editor.name + '：关闭对话框立即退出键盘操作，画面平滑淡出', async function () {
          const native = editor.path === 'platform.html';
          const result = native ? null : window.SignUI.confirmDialog('测试内容', '测试标题');
          const dialog = document.querySelector(native ? '#batch-dialog' : '.modal-mask');
          if (native) dialog.showModal();
          const opening = animations(dialog, true);
          assert(reduced ? opening.length === 0 : opening.length > 0, '打开对话框时应遵循减少动态效果设置');
          await finishAnimations(opening);
          if (native) dialog.close();
          else dialog.querySelector('[data-act="cancel"]').click();
          const leaving = animations(dialog, true);
          assert(native ? !dialog.open : dialog.inert && await result === false, '关闭时应立即解除对话框的操作状态');
          assert(reduced ? leaving.length === 0 : leaving.length > 0, '关闭时应在允许动态效果时淡出');
          await finishAnimations(leaving);
          assert(!dialog.isConnected || window.getComputedStyle(dialog).display === 'none', '退出动画结束后应完全隐藏');
        });
      }
    }
  } catch (error) {
    await test('打开测试页面', function () { throw error; });
  } finally {
    await load('about:blank');
    for (const [key, value] of savedStorage) {
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    }
    const passed = results.querySelectorAll('.pass').length;
    document.getElementById('summary').textContent = passed + ' / ' + results.children.length + ' 通过';
    document.title = passed === results.children.length ? '✔ 页眉和动画测试全部通过' : '✖ 页眉和动画测试失败';
  }
})();
</script>
