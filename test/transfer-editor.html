<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>换乘标识编辑器测试</title>
<style>
  body { font: 14px system-ui; }
  iframe { display: block; width: 1280px; height: 850px; border: 1px solid #bbb; }
  .pass { color: #087338; }
  .fail { color: #bd2222; }
</style>
<h1>换乘标识编辑器测试</h1>
<p id="summary" role="status">运行中…</p>
<ol id="results"></ol>
<iframe id="editor" title="测试用编辑器"></iframe>
<script>
(async function () {
  const frame = document.getElementById('editor');
  const results = document.getElementById('results');
  const storageKeys = ['public-sign-autosave', 'public-sign-instance', 'public-transfer-sign-project-v1'];
  const savedStorage = storageKeys.map(key => [key, localStorage.getItem(key)]);
  let editor, page, guideArrows;

  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }
  function navigate(action) {
    return new Promise(resolve => {
      frame.addEventListener('load', () => {
        editor = frame.contentWindow;
        page = editor.document;
        resolve();
      }, { once: true });
      action();
    });
  }
  async function waitFor(check) {
    for (let remaining = 200; remaining > 0; remaining--) {
      if (check()) return;
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    throw new Error('等候编辑器更新超时');
  }
  function element(selector) {
    const control = page.querySelector(selector);
    assert(control, '找不到控件 ' + selector);
    return control;
  }
  function input(selector, value, type = 'input') {
    const control = element(selector);
    control.value = value;
    control.dispatchEvent(new editor.Event(type, { bubbles: true }));
    return control;
  }
  function drawing(role) {
    return [...element('#transfer-sign').querySelectorAll('[data-role="' + role + '"]')];
  }
  function chooseFile(name, content, type, selector = '#line-pattern-file') {
    const selection = new editor.DataTransfer();
    selection.items.add(new editor.File([content], name, { type }));
    const file = element(selector);
    file.files = selection.files;
    file.dispatchEvent(new editor.Event('change', { bubbles: true }));
  }
  async function test(name, run) {
    const result = document.createElement('li');
    try {
      await run();
      result.className = 'pass';
      result.textContent = name;
    } catch (error) {
      result.className = 'fail';
      result.textContent = name + '。' + error.message;
    }
    results.append(result);
  }

  function click(selector) {
    element(selector).dispatchEvent(new editor.MouseEvent('click', { bubbles: true }));
  }
  function select(key) { click('[data-transfer-element="' + key + '"]'); }
  function mode(name) { click('[data-transfer-mode="' + name + '"]'); }
  function returnToSettings() {
    if (!element('#transfer-return').hidden) click('#transfer-return');
  }
  function arrangement(value) {
    returnToSettings();
    click('[data-transfer-arrangement="' + value + '"]');
  }
  function direction(group, value) {
    select('arrow:' + group);
    click('[data-transfer-direction="' + value + '"]');
  }
  function line(index, name) {
    select('line:' + index);
    if (name !== undefined) input('#transfer-line-name', name);
  }
  function numberLabels() { return drawing('line-number').map(node => node.textContent).join(','); }
  function isVisible(selector) { return element(selector).getClientRects().length > 0; }

  try {
    storageKeys.forEach(key => localStorage.removeItem(key));
    await test('从导向页切到同一个网页的换乘编辑器，显示版式 A 和版式 B', async () => {
      await navigate(() => { frame.src = '../index.html'; });
      await waitFor(() => editor.App?.measure);
      guideArrows = Array.from(page.querySelectorAll('.direction-grid .direction-card'), card => card.querySelector('path').getAttribute('d'));
      editor.App.update(current => editor.SignState.updateSignSettings(current, { backgroundColor: '#102030' }));
      await navigate(() => {
        element('.editor-switch').click();
        const link = element('.editor-navigation a[href="index.html?editor=transfer"]');
        assert(link.getClientRects().length, '展开后应能点击换乘标识入口');
        link.click();
      });
      await editor.App.ready;
      assert(editor.location.pathname.endsWith('/index.html'), '换乘编辑器应使用同一个网页');
      assert(element('.editor-navigation [aria-current="page"]').textContent.trim() === '换乘标识', '页眉没有标出当前编辑器');
      assert(element('.editor-switch').textContent.trim() === '换乘标识编辑器', '大标题应显示换乘标识编辑器的全称');
      assert(!element('#transfer-editor').hidden && element('#app').hidden, '只应显示换乘编辑器');
      assert(element('[data-transfer-mode="guidance"]').textContent.trim() === '版式 A', '版式 A 标签有误');
      assert(element('[data-transfer-mode="separate"]').textContent.trim() === '版式 B', '版式 B 标签有误');
      assert(element('#transfer-preview-title').textContent === '版式 A', '预览标题没有跟随页眉');
      assert(numberLabels() === '1/10', '版式 A 默认应同时显示两条线路');
      const number = drawing('line-number')[0];
      assert(number.getAttribute('font-family') === editor.SignCore.FONT_NUM && number.getAttribute('font-weight') === '400',
        '线路数字未用导向标识的常规字重');
    });

    await test('换乘标识使用统一的浏览器标签页标题', () => {
      assert(page.title === 'CRT标识编辑器 - 换乘标识', '换乘标识网页标题有误');
    });

    await test('从左栏点选线路和箭头，右栏显示对应属性，左栏仍可切换分组', () => {
      assert(element('#transfer-content').contains(element('#transfer-arrangements')) &&
        element('#transfer-content').contains(element('#transfer-groups')), '分组和牌面元素应放在左栏');
      click('#transfer-groups [data-select-transfer="line:first"]');
      assert(isVisible('#transfer-line-properties') && isVisible('#transfer-arrangements'), '编辑线路时仍应能使用左栏分组');
      click('#transfer-groups [data-select-transfer="arrow:upper"]');
      assert(isVisible('#transfer-arrow-properties') && isVisible('#transfer-groups'), '从左栏切换到箭头时应显示对应属性');
      returnToSettings();
    });

    await test('窄窗口仍可在左栏点选版式 B 的四个分组按钮', async () => {
      const originalWidth = frame.style.width;
      frame.style.width = '769px';
      try {
        mode('separate');
        await new Promise(resolve => editor.requestAnimationFrame(() => editor.requestAnimationFrame(resolve)));
        const picker = element('#transfer-arrangements');
        const bounds = picker.getBoundingClientRect();
        assert(picker.children.length === 4 && [...picker.children].every(button => {
          const area = button.getBoundingClientRect();
          return area.left >= bounds.left && area.right <= bounds.right;
        }), '四个分组按钮都应完整显示在左栏');
        click('#transfer-groups [data-select-transfer="arrow:lower"]');
        click('[data-transfer-arrangement="1"]');
        assert(isVisible('#transfer-settings') && !page.querySelector('[data-transfer-element="arrow:lower"]'),
          '从左栏改为单线路后，应关闭已移除的下组箭头属性');
      } finally {
        arrangement('1+1');
        mode('guidance');
        frame.style.width = originalWidth;
      }
    });

    await test('点选色带、文字和箭头，选框、属性面板与浮动工具栏跟随选择', async () => {
      select('line:first');
      assert(element('[data-transfer-element="line:first"]').getAttribute('aria-pressed') === 'true', '色带没有选框');
      assert(isVisible('#transfer-element-toolbar') && isVisible('#line-pattern-section'), '缺少浮动工具栏或独立底纹');
      click('#transfer-tool-edit');
      assert(page.activeElement === element('#transfer-line-name'), '浮动工具栏未将焦点移到线路名');
      click('#transfer-tool-pattern');
      assert(drawing('line-pattern').length === 1 && drawing('line-pattern')[0].dataset.line === 'first', '浮动开关改动了其他线路');
      click('#transfer-tool-pattern');
      select('label:upper');
      assert(isVisible('#transfer-label-properties') && element('#transfer-label-lines').children.length === 2, '文字选择没有列出它包含的线路');
      click('#transfer-label-lines [data-select-line="second"]');
      assert(element('#transfer-line-name').value === '10', '点击文字列表未打开相应线路');
      select('arrow:upper');
      assert(isVisible('#transfer-arrow-properties') && element('#transfer-directions').children.length === 12, '未显示十二个方向图标');
      click('#transfer-tool-turn');
      assert(drawing('direction-arrow')[0].dataset.direction === 'right-up', '工具栏没有顺时针转向');
      click('#transfer-return');
      assert(isVisible('#transfer-settings') && page.activeElement === element('#transfer-heading'), '返回后没有显示设置或恢复焦点');
      assert(element('#transfer-element-toolbar').hidden && element('#transfer-element-toolbar').inert, '清除选择后工具栏仍可操作');
      await waitFor(() => !isVisible('#transfer-element-toolbar'));
      const arrow = element('[data-transfer-element="arrow:upper"]');
      arrow.focus();
      arrow.dispatchEvent(new editor.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      assert(arrow.getAttribute('aria-pressed') === 'true', '键盘没有选中箭头');
      click('#transfer-preview-scroll');
      assert(element('#transfer-element-toolbar').hidden && arrow.getAttribute('aria-pressed') === 'false', '点击空白后仍选中元素');
    });

    await test('两种版式的预览标题跟随页眉，十二个方向图标与导向标识一致', () => {
      for (const [current, title] of [['guidance', '版式 A'], ['separate', '版式 B']]) {
        mode(current);
        assert(element('#transfer-preview-title').textContent === title, '预览标题没有跟随页眉');
        select('arrow:upper');
        const cards = Array.from(element('#transfer-directions').children);
        assert(cards.length === 12 && guideArrows.length === 12, '方向图标数量不一致');
        for (const [index, card] of cards.entries()) {
          click('[data-transfer-direction="' + card.dataset.transferDirection + '"]');
          assert(card.getAttribute('aria-pressed') === 'true', '方向卡片未标记当前选择');
          assert(card.querySelector('path').getAttribute('d') === guideArrows[index], '方向卡片图形与导向标识不同');
          assert(drawing('direction-arrow')[0].querySelector('path').getAttribute('d') === guideArrows[index], '牌面箭头与导向标识不同');
        }
      }
      direction('upper', 'left');
      mode('guidance');
      direction('upper', 'left-up');
    });

    await test('两个版式各自保存，撤销和重做只影响当前版式', () => {
      line('second', '9');
      input('#transfer-line-color', '#123456');
      returnToSettings();
      input('#transfer-width', '480', 'change');
      arrangement('1');
      assert(numberLabels() === '1' && drawing('line-band').length === 1, '改单线路后仍有第二条线路');
      arrangement('2');
      assert(numberLabels() === '1/9' && drawing('line-band')[1].getAttribute('fill') === '#123456', '恢复双线路丢失了原内容');
      mode('separate');
      assert(numberLabels() === '1,10' && element('#transfer-width').value === '768', '版式 A 的线路或尺寸进入了版式 B');
      direction('lower', 'right-down');
      click('#transfer-undo');
      assert(drawing('direction-arrow')[1].dataset.direction === 'right', '撤销未恢复版式 B 的方向');
      click('#transfer-redo');
      assert(drawing('direction-arrow')[1].dataset.direction === 'right-down', '重做未恢复版式 B 的方向');
      mode('guidance');
      assert(numberLabels() === '1/9' && element('#transfer-width').value === '480' &&
        drawing('direction-arrow')[0].dataset.direction === 'left-up', '返回版式 A 后丢失了自己的设置');
      click('#transfer-undo');
      assert(numberLabels() === '1', '版式 A 没有继续自己的撤销记录');
      click('#transfer-redo');
      mode('separate');
      assert(drawing('direction-arrow')[1].dataset.direction === 'right-down', '版式 A 的撤销影响了版式 B');
    });

    await test('版式 B 的单线路和 1 + 1 中，箭头和文字选框都在对应色带下方', () => {
      mode('separate');
      for (const value of ['1', '1+1']) {
        arrangement(value);
        const bands = drawing('line-band');
        assert(bands.length === (value === '1' ? 1 : 2), '色带数量不正确');
        bands.forEach((band, index) => {
          const bounds = band.getBBox();
          const nextTop = bands[index + 1]?.getBBox().y ?? 1024;
          for (const kind of ['arrow', 'label']) {
            const selection = element('[data-transfer-element="' + kind + ':' + band.dataset.group + '"]').getBBox();
            assert(selection.y > bounds.y + bounds.height && selection.y + selection.height < nextTop,
              value + ' 的箭头和文字选框应位于本组色带下方，并留在本组范围内');
          }
        });
      }
    });

    await test('版式 B 的两种三线路分组都有两支箭头和三条独立色带', () => {
      for (const [value, texts, groups] of [
        ['1+2', '1,10/6', 'upper,lower,lower'],
        ['2+1', '1/10,6', 'upper,upper,lower'],
      ]) {
        arrangement(value);
        assert(numberLabels() === texts && drawing('direction-arrow').length === 2, '文字或箭头没有按两组绘制');
        assert(drawing('line-band').map(node => node.dataset.group).join(',') === groups, '色带分组不正确');
        assert(element('[data-transfer-arrangement="' + value + '"]').getAttribute('aria-pressed') === 'true', '没有显示当前分组');
        const [upper, lower] = drawing('line-number');
        assert(upper.getAttribute('font-size') === lower.getAttribute('font-size'), '上下两组常用数字字号不一致');
        for (const group of ['upper', 'lower']) {
          const lastBand = drawing('line-band').filter(node => node.dataset.group === group).at(-1);
          const edge = Number(lastBand.getAttribute('y')) + Number(lastBand.getAttribute('height'));
          for (const name of ['arrow', 'label']) {
            assert(Number(element('[data-transfer-element="' + name + ':' + group + '"]').getAttribute('y')) > edge,
              '箭头和文字应在本组色带下方');
          }
        }
      }
      line('third', '5');
      const name = element('#transfer-line-name');
      name.focus();
      input('#transfer-line-name', '6');
      assert(page.activeElement === name && element('#transfer-line-name') === name, '编辑线路名称时失去焦点');
      arrangement('1+1');
      assert(!page.querySelector('[data-transfer-element="line:third"]') && isVisible('#transfer-settings'), '隐藏的第三条线路仍可选中');
      arrangement('1+2');
      assert(numberLabels() === '1,10/6', '恢复分组后丢失第三条线路');
    });

    await test('两条色带分别设置底纹，1 号线只显示放大后的那一种纹样', () => {
      line('first');
      click('#line-pattern-enabled');
      assert(element('#line-pattern-status').textContent.includes('1号线'), '未自动匹配 1 号线');
      assert(element('#line-pattern-built-in').querySelectorAll('[value^="line-1"]:not([value="line-10"])').length === 1, '仍有两种 1 号线纹样');
      const firstPattern = element('#transfer-sign pattern');
      const firstBandHeight = Number(drawing('line-band')[0].getAttribute('height'));
      assert(Math.abs(Number(firstPattern.getAttribute('height')) - firstBandHeight * 256 / 647) < 1e-7, '1 号线的默认纹样没放大');
      assert(firstPattern.querySelector('[stroke="#f0728a"]'), '1 号线底纹没有用增强后的深浅');
      line('second');
      assert(element('#line-pattern-enabled').getAttribute('aria-checked') === 'false', '第二条线路跟随第一条启用了底纹');
      click('#line-pattern-enabled');
      const secondPattern = element('#transfer-sign').querySelectorAll('pattern')[1];
      assert(Math.abs(Number(secondPattern.getAttribute('height')) - firstBandHeight * 0.9 * 3 * 143 / 647) < 1e-7 &&
        secondPattern.querySelector('[stroke="#6f3aa9"], [fill="#6f3aa9"]'), '10 号线没有用缩小、减淡后的底纹');
      input('#line-pattern-source', 'line-6', 'change');
      input('#line-pattern-size', '160');
      input('#line-pattern-opacity', '45');
      assert(drawing('line-pattern').length === 2, '应有两条带底纹的色带');
      assert(element('#line-pattern-size-value').textContent === '160%' && element('#line-pattern-opacity-value').textContent === '45%', '没有显示当前数值');
      line('first');
      assert(element('#line-pattern-source').value === 'automatic' && element('#line-pattern-size').value === '100', '改第二条覆盖了第一条');
      line('second');
      click('#line-pattern-enabled');
      assert(drawing('line-pattern').length === 1, '关闭一条底纹影响了另一条');
      click('#line-pattern-enabled');
      assert(element('#line-pattern-size').value === '160', '打开后应恢复原调整值');
      click('#line-pattern-reset-size');
      click('#line-pattern-reset-opacity');
      assert(element('#line-pattern-size').value === '100' && element('#line-pattern-opacity').value === '85', '没有恢复默认值');
    });

    await test('第三条线路可上传自己的底纹，损坏文件或切换选择时不会覆盖其他线路', async () => {
      const artwork = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><circle cx="4" cy="4" r="3" fill="white"/></svg>';
      line('third');
      assert(element('#line-pattern-import').textContent === '上传底纹', '应显示上传底纹');
      chooseFile('纹样.svg', artwork, 'image/svg+xml');
      await waitFor(() => element('#line-pattern-source').value === 'custom');
      assert(element('#line-pattern-import').textContent === '更换底纹', '已有底纹时应显示更换底纹');
      assert(element('#transfer-sign').querySelectorAll('pattern image[href^="data:image/png"]').length === 1, '图片铺到了其他色带');
      chooseFile('损坏.png', '无法打开的图片', 'image/png');
      await waitFor(() => element('#transfer-status').textContent.includes('导入失败'));
      assert(element('#line-pattern-source').value === 'custom', '上传失败改变了原底纹');
      click('#line-pattern-clear');
      assert(element('#line-pattern-custom').disabled && drawing('line-pattern').length === 2, '移除图片影响了其他底纹');
      chooseFile('另一张.svg', artwork, 'image/svg+xml');
      line('second');
      await waitFor(() => element('#transfer-status').textContent.includes('已更改'));
      assert(element('#line-pattern-source').value === 'line-6', '切换线路后上传图片覆盖了新选择');
    });

    await test('矢量图的斜向箭头与预览一致，图片导出包含三条色带和对应尺寸', async () => {
      returnToSettings();
      input('#transfer-width', '480', 'change');
      direction('upper', 'right-up');
      input('#transfer-tool-alignment select', 'right', 'change');
      input('#transfer-tool-arrow-position select', 'right', 'change');
      const previewArrow = drawing('direction-arrow')[0];
      const expectedArrow = previewArrow.querySelector('path').getAttribute('d');
      line('second');
      const downloads = [];
      const originalDownload = editor.SignStorage.download;
      editor.SignStorage.download = (blob, name) => downloads.push({ blob, name });
      try {
        click('#transfer-export-vector');
        await waitFor(() => downloads.length === 1);
        const source = await downloads[0].blob.text();
        const vector = new DOMParser().parseFromString(source, 'image/svg+xml');
        assert(downloads[0].name.endsWith('.svg') && !vector.querySelector('parsererror'), '矢量图无法打开');
        assert(vector.querySelectorAll('pattern').length === 2 && source.includes('@font-face'), '导出缺少底纹或字体');
        assert(vector.documentElement.getAttribute('width') === '480' && !vector.querySelector('[data-transfer-element]'), '导出了选框或尺寸不正确');
        const exportedArrow = Array.from(vector.querySelectorAll('path')).find(path => path.getAttribute('d') === expectedArrow);
        assert(exportedArrow?.closest('svg').getAttribute('x') === previewArrow.getAttribute('x'), '导出的箭头或对齐位置与预览不同');
        assert(exportedArrow.closest('svg').getAttribute('viewBox') === previewArrow.getAttribute('viewBox'), '导出的箭头留白与预览不同');
        click('#transfer-export-image');
        await waitFor(() => downloads.length === 2);
        const picture = await createImageBitmap(downloads[1].blob);
        const canvas = document.createElement('canvas');
        canvas.width = picture.width;
        canvas.height = picture.height;
        const drawingContext = canvas.getContext('2d');
        drawingContext.drawImage(picture, 0, 0);
        assert(picture.width === 480 && picture.height === 640, '图片尺寸不正确');
        const third = drawingContext.getImageData(240, 410, 1, 1).data;
        assert(third[3] === 255 && third[0] > third[1] && third[0] > 200, '图片没有画出第三条色带');
        picture.close();
      } finally {
        editor.SignStorage.download = originalDownload;
      }
    });

    await test('回到导向页再打开换乘页，两个版式的设置都保存到本机', async () => {
      select('arrow:upper');
      input('#transfer-group-alignment select', 'right', 'change');
      input('#transfer-group-arrow-position select', 'right', 'change');
      await navigate(() => {
        element('.editor-switch').click();
        element('.editor-navigation a[href="index.html"]').click();
      });
      await waitFor(() => editor.App?.measure);
      assert(editor.App.state.backgroundColor === '#102030', '切回后丢失了导向标识');
      await navigate(() => {
        element('.editor-switch').click();
        element('.editor-navigation a[href="index.html?editor=transfer"]').click();
      });
      await editor.App.ready;
      assert(numberLabels() === '1,10/6' && drawing('line-pattern').length === 2, '版式 B 的分组或底纹没有载入');
      assert(drawing('direction-arrow')[1].dataset.direction === 'right-down', '没有载入下方箭头');
      select('label:upper');
      assert(element('#transfer-group-alignment select').value === 'right', '没有载入上组对齐设置');
      assert(element('#transfer-group-arrow-position select').value === 'right', '没有载入上组箭头位置');
      mode('guidance');
      assert(numberLabels() === '1/9' && element('#transfer-width').value === '480', '版式 A 没有载入');
    });

    await test('每组的箭头可从工具栏和右侧栏移到文字左侧或右侧，位置可撤销重做', () => {
      mode('separate');
      const toolbarPosition = '#transfer-tool-arrow-position select';
      const panelPosition = '#transfer-group-arrow-position select';
      function bounds(kind, group) {
        return element('[data-transfer-element="' + kind + ':' + group + '"]').getBBox();
      }
      for (const value of ['1+1', '1+2', '2+1']) {
        arrangement(value);
        const lowerBefore = bounds('arrow', 'lower').x;
        const directions = drawing('direction-arrow').map(node => node.dataset.direction);
        select('arrow:upper');
        input(toolbarPosition, 'right', 'change');
        const label = bounds('label', 'upper');

        assert(await download.blob.text() === source, '下载内容不是完整项目');
        await navigate(() => { frame.src = 'about:blank'; });
        localStorage.removeItem('public-transfer-sign-project-v1');
        await navigate(() => { frame.src = '../index.html?editor=transfer'; });
        await editor.App.ready;
        line('first', '4');
        const beforeImport = editor.TransferState.serialize(editor.App.state);
        const file = element('#transfer-project-file');
        let opened = false;
        file.click = () => { opened = true; };
        click('#transfer-import-project');
        assert(opened && file.hidden && file.accept.includes('.json'), '未使用隐藏的 JSON 文件选择控件');
        chooseFile(download.name, source, 'application/json', '#transfer-project-file');
        await waitFor(() => element('#transfer-status').textContent === '项目已导入');
        assert(editor.TransferState.serialize(editor.App.state) === source, '两种版式的内容没有全部恢复');
        assert(isVisible('#transfer-settings') && !isVisible('#transfer-line-properties'), '导入后应回到整牌设置');
        assert(element('#transfer-preview-title').textContent === '版式 B' && drawing('line-band').length === 3, '预览没有更新到导入的版式');
        click('#transfer-undo');
        assert(editor.TransferState.serialize(editor.App.state) === beforeImport, '一次撤销没有恢复导入前两个版式');
        assert(isVisible('#transfer-line-properties'), '撤销没有恢复原来选中的线路');
        click('#transfer-redo');
        assert(editor.TransferState.serialize(editor.App.state) === source && !isVisible('#transfer-line-properties'), '重做没有恢复导入结果');
        mode('guidance');
        const guidance = editor.TransferState.board(editor.App.state);
        assert(guidance.width === 611 && guidance.arrangement === '1' && guidance.directions.upper === 'left-down', '版式 A 的宽度、排列或方向未恢复');
        assert(guidance.lines[0].englishName === 'Airport Line' && guidance.lines[0].color === '#13579B' &&
          guidance.lines[0].linePattern.image && guidance.lines[0].linePattern.opacity === 46, '版式 A 的线路颜色、文字或底纹未恢复');
        mode('separate');
        await waitFor(() => localStorage.getItem('public-transfer-sign-project-v1') === source);
        await navigate(() => editor.location.reload());
        await editor.App.ready;
        assert(editor.TransferState.serialize(editor.App.state) === source, '刷新后没有恢复导入结果');
      } finally {
        editor.SignStorage.download = originalDownload;
      }
    });

    await test('错误的换乘项目文件会提示原因，并保留当前项目和撤销记录', async () => {
      const source = editor.TransferState.serialize(editor.App.state);
      const undoDisabled = element('#transfer-undo').disabled;
      for (const [name, content, message] of [
        ['项目.txt', source, '请选择 JSON 文件'],
        ['项目.json', '{', 'JSON 格式有误'],
        ['项目.json', '{"kind":"platform-sign","version":2}', '请选择换乘标识项目'],
        ['项目.json', '{"kind":"transfer-sign","version":3}', '只支持版本 1 和 2'],
        ['项目.json', '{"kind":"transfer-sign","version":2,"mode":"separate"}', '缺少版式'],
        ['项目.json', ' '.repeat(2 * 1024 * 1024 + 1), '不能超过 2 MB'],
      ]) {
        chooseFile(name, content, 'application/json', '#transfer-project-file');
        await waitFor(() => element('#transfer-status').textContent.includes(message));
        assert(editor.TransferState.serialize(editor.App.state) === source, '导入失败后项目发生变化');
        assert(element('#transfer-undo').disabled === undoDisabled, '导入失败后撤销记录发生变化');
      }
    });
    await test('换乘项目拒绝只有图片头的底纹文件，保留当前项目', async () => {
      const current = editor.TransferState.serialize(editor.App.state);
      const project = editor.TransferState.create();
      project.boards.guidance.lines[0].linePattern = {
        enabled: true, source: 'custom', size: 100, opacity: 85,
        image: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB',
      };
      chooseFile('损坏底纹.json', editor.TransferState.serialize(project), 'application/json', '#transfer-project-file');
      await waitFor(() => element('#transfer-status').textContent.includes('底纹图片无法读取'));
      assert(editor.TransferState.serialize(editor.App.state) === current, '损坏底纹覆盖了当前项目');
    });
    await test('连续选择两个项目文件时，较早开始的读取不能覆盖后选的项目', async () => {
      const state = editor.TransferState;
      const first = state.serialize(state.settings(state.create(), { width: 401 }));
      const second = state.serialize(state.settings(state.create(), { width: 402 }));
      const readText = editor.File.prototype.text;
      let finishFirst;
      editor.File.prototype.text = function () {
        if (this.name === '较早选择.json') return new Promise(resolve => { finishFirst = resolve; });
        return readText.call(this);
      };
      try {
        chooseFile('较早选择.json', first, 'application/json', '#transfer-project-file');
        await waitFor(() => finishFirst);
        chooseFile('后来选择.json', second, 'application/json', '#transfer-project-file');
        await waitFor(() => state.serialize(editor.App.state) === second);
        finishFirst(first);
        await new Promise(resolve => setTimeout(resolve, 100));
        assert(state.serialize(editor.App.state) === second, '较早开始的读取覆盖了后选的项目');
      } finally {
        editor.File.prototype.text = readText;
      }
    });
    await test('切换版式后也能依次撤销其他版式的后续修改和整份项目导入', async () => {
      const state = editor.TransferState;
      const initial = state.serialize(editor.App.state);
      const project = state.settings(state.create(), { mode: 'guidance', width: 530 });
      chooseFile('换乘项目.json', state.serialize(project), 'application/json', '#transfer-project-file');
      await waitFor(() => state.serialize(editor.App.state) === state.serialize(project));
      mode('separate');
      line('first', '后改的线路');
      mode('guidance');
      assert(!element('#transfer-undo').disabled, '切换版式后无法撤销导入');
      click('#transfer-undo');
      assert(editor.App.state.mode === 'separate' && editor.App.state.boards.separate.lines[0].name === project.boards.separate.lines[0].name,
        '应先撤销导入后的线路修改');
      click('#transfer-undo');
      assert(state.serialize(editor.App.state) === initial, '应再撤销整份项目导入');
      click('#transfer-redo');
      assert(editor.App.state.boards.guidance.width === 530, '重做未恢复导入的项目');
      click('#transfer-redo');
      assert(editor.App.state.boards.separate.lines[0].name === '后改的线路', '重做丢失了导入后的线路修改');
    });
  } finally {
    await navigate(() => { frame.src = 'about:blank'; });
    savedStorage.forEach(([key, value]) => value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value));
    const failed = results.querySelectorAll('.fail').length;
    const summary = (results.children.length - failed) + ' 通过 / ' + failed + ' 失败';
    document.getElementById('summary').textContent = summary;
    document.title = (failed ? '✖ ' : '✔ ') + summary + ' 换乘标识编辑器测试';
  }
})();
</script>
</html>
