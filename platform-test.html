        var patterned = S.settings(plain, { linePattern: { source: 'line-10', opacity: 100 } });
        var base = await patternPixels(plain, 2), result = await patternPixels(patterned, 2);
        var copy = new w.DOMParser().parseFromString(result.vector, 'image/svg+xml');
        assert(!copy.querySelector('parsererror') && copy.querySelector('pattern circle'));
        assert(copy.querySelector('desc').textContent.includes('Hachi'));
        assert(!copy.querySelector('[data-role], .platform-hitbox, pattern image'));
        var patternedArea = [120, 210, 100, 15];
        if (mode === 'vertical') {
          var band = result.scene.nodes.find(function (node) { return node.attrs['data-role'] === 'vertical-active-bar'; }).attrs;
          var frameScale = result.scene.frame.scale * 2;
          patternedArea = [Math.ceil((band.x + 5) * frameScale), Math.ceil((band.y + 35) * frameScale), 35, 20];
        }
        var greyArea = mode === 'vertical' ? [375, 185, 43, 40] : [902, 210, 30, 15];

        var baseline = area(base.context, patternedArea), changed = area(result.context, patternedArea);
        assert(changed.some(function (value, index) { return Math.abs(value - baseline[index]) > 8; }), mode + ' 导出色带应看得到底纹');
        baseline = area(base.context, greyArea);
        assert(area(result.context, greyArea).every(function (value, index) { return value === baseline[index]; }), mode + ' 灰色段像素应一致');
      }
      restore();
    });
    await test('自定义底纹：导入矢量图和透明图片，坏文件保留已选纹样，项目与预设可载回', async function () {

      await waitFor(function () { return notificationText().includes('底纹导入失败'); });

      assert(A.state.linePattern.image === image);
      $('line-pattern-clear').click();
      chooseFile('project-file', new w.File([project], '底纹项目.json', { type: 'application/json' }));
      await waitFor(function () { return A.state.linePattern.image === image; });
      await A.projects.flush();
      assert(JSON.parse((await A.projects.read(A.projects.current.id)).data).linePattern.image === image);
      $('return-to-settings').click();
      d.querySelector('[data-property-tab-button="appearance"]').click();
      input('line-pattern-source', 'line-1', 'change');
      $('line-pattern-clear').click();
      assert(A.state.linePattern.enabled && A.state.linePattern.source === 'line-1' && A.state.linePattern.image === null,
